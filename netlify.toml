[build]
  command = "npm run build"
  publish = "dist"

# SPA routing — send all paths to index.html for React Router.
#
# IMPORTANT: 404 missing /assets/* requests instead of falling through
# to the SPA index.html. If a stale index.html (held by a browser HTTP
# cache or PWA precache) references an old hashed chunk that no longer
# exists in this deploy, we want Netlify to return a real 404 — that
# signals the browser the chunk is missing instead of returning HTML
# with a 200 (which the browser then tries to parse as a JS module and
# rejects on MIME type, breaking the whole page). With a real 404 in
# place, the SW update flow can detect the missing chunk and prompt
# the user to reload onto the new build. Static files in /assets that
# DO exist are still served normally because force defaults to false —
# the redirect only fires when there's no matching file on disk.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers applied to all responses
[[headers]]
  for = "/*"
  [headers.values]
    # Only load scripts from same origin; only connect to Anthropic API.
    # worker-src 'self' — allows the PWA service worker to register from the same origin.
    # manifest-src 'self' — allows the web app manifest to be fetched from the same origin.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.anthropic.com; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self';"
    # Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # No referrer information sent to external sites
    Referrer-Policy = "no-referrer"
    # Restrict browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
