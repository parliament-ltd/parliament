[build]
  command = "npm run build"
  publish = "dist"

# SPA routing — send all paths to index.html for React Router.
#
# IMPORTANT: 404 missing /assets/* requests instead of falling through
# to the SPA index.html. If a stale index.html (held by a browser HTTP
# cache or PWA precache) references an old hashed chunk that no longer
# exists in this deploy, we want Netlify to return a real 404 — that
# signals the browser the chunk is missing instead of returning HTML
# with a 200 (which the browser then tries to parse as a JS module and
# rejects on MIME type, breaking the whole page). With a real 404 in
# place, the SW update flow can detect the missing chunk and prompt
# the user to reload onto the new build. Static files in /assets that
# DO exist are still served normally because force defaults to false —
# the redirect only fires when there's no matching file on disk.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers applied to all responses.
# Keep these identical to src/lib/securityHeaders.js, which vite preview uses;
# src/lib/securityHeaders.test.js fails if the two differ.
[[headers]]
  for = "/*"
  [headers.values]
    # Scripts, styles and images from this site only (C270); connections to this site and the sources
    # and local models that have shipped. Providers that take a key are
    # reached only through the key vault, the one frame allowed (stage 15;
    # research/vault-design.md). base-uri and form-action are not covered by
    # default-src, so each is closed explicitly.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:11434 https://*.wikipedia.org https://hn.algolia.com https://api.openalex.org; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src https://keys.parliament.ltd; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self';"
    # Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # No referrer information sent to external sites
    Referrer-Policy = "no-referrer"
    # Browser features. The microphone is this site's only, for voice input
    # transcribed on the device; everything Parliament does not use is off.
    Permissions-Policy = "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(self), midi=(), payment=(), serial=(), usb=(), window-management=(self)"
    # Keep other sites' windows and pages from reaching into this one.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
