[build]
  command = "npm run build"
  publish = "dist"

# SPA routing — send all paths to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers applied to all responses
[[headers]]
  for = "/*"
  [headers.values]
    # Only load scripts from same origin; only connect to Anthropic API.
    # worker-src 'self' — allows the PWA service worker to register from the same origin.
    # manifest-src 'self' — allows the web app manifest to be fetched from the same origin.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.anthropic.com; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self';"
    # Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # No referrer information sent to external sites
    Referrer-Policy = "no-referrer"
    # Restrict browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
