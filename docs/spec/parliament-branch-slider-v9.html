<!--
PARLIAMENT · BRANCH SLIDER v9
Follows parliament_almanac_v30.html (the field, its chips, fills and marginalia)
and parliament_docket_v12.html (status vocabulary: ready, running, done,
waiting, paused). Reference material, not production code.

CHANGES FROM v8
  · Under every reply, both ways to open it, always shown:
      open:201a           its own card, full history, keeps its letter
      open:201a summary   a new branch (next free letter) from a summary
    with the local context estimate beside the second. The user decides
    when to summarise; nothing appears or disappears at a threshold.
  · The Enter line describes each before it runs, including that a summary
    costs one model call.
  · The reply target is a two-way toggle in the field, always visible:
    "to 201a · all three", plus a caret for two of three. The placeholder
    repeats it.
  · State 5: replying to all three. The tabs carry on, sticky, and each tab
    holds that branch's whole thread.

CHANGES FROM v7
  · The selected tab's underline is back (2px ink, no negative margin, so the
    scrolling tab row can't clip it).
  · Dots removed. Tabs say where you are and their status words say what is
    still writing; open:201a is centred under the reply as its one action.
  · ⌥← ⌥→ switch replies from inside the field; ← → when it is empty.
  · After branching, the field's marginalia names where the reply goes
    ("to 201a · Sonnet", "to all three") and its picker becomes Reply to:
    the branches, with the same numbered boxes. Unticked, it follows the slide
    being viewed; once ticked it holds.
  · No explicit "main branch" act: replying to one branch is the choice.

CHANGES FROM v6
  · Every ticked box shows its number, in either order. The number is the
    priority: the order of the slider's tabs when all run at once, and the
    running order when they run one after another. Tick order sets it;
    unticking closes the gap; re-ticking puts a source at the back.

CHANGES FROM v5
  · In order, a ticked box shows its position instead of a check. The order is
    the order of ticking; unticking closes the gap and re-ticking puts a
    source at the back. The separate number beside the name is gone.

CHANGES FROM v4
  · Sources, no tokens now holds the keyless sources from the Sept 14 RSS and
    Sept 23 sources notes, plus Brave Search and Kiwix, under four quiet
    labels by kind of question: Reference, Research, Web and discussion,
    Media and data.
  · The group heading carries "0 tokens"; a row shows a mark only where it
    differs: your key (Brave), on your machine (Kiwix), later (News).
  · Not yet checked for CORS: arXiv, Kiwix, Brave. See the smoke test.

CHANGES FROM v3
  · The picker is the Sept 12 answered-by popover, grouped by type (Models;
    Sources, no tokens) with icon, cost mark and a line of explanation.
    Selection is an ink wash and the cost mark is ink, per the gold rule.
  · This reverses the Sept 23 decision (flat list, no groups) and Docket v12
    open item 4. Within each group, rows stay in cost order.

CHANGES FROM v2
  · The source picker is the existing answered-by .menu (Docket v12, Almanac
    v30), ordered by cost mark. Additions: a box in the tick slot, the order
    pair under a rule, and a condition gloss on each later source.
  · The source marginalia in the field grows its caret on hover only.
  · The current tab is underlined again; the rule is the tab's own border, so
    the scrolling tab row can no longer clip it.

CHANGES FROM v1
  · Marginalia under the prompt and "stays in place" copy removed.
  · A reply's marginalia no longer repeats the source or token use; the tab
    names the source, the docket holds the cost. Only open:201a remains.
  · open:201a replaces pop: on every slide. Ids lose the dot: 201a, not 201.a.
  · Arrows sit either side of the reply and stay in view while it scrolls.
    Dots are centred below.
  · Sources are chosen from marginalia inside the prompt field. The picker has
    checkboxes, so one prompt can go to several sources.
  · Order: "all at once" or "one after another". In order, every source after
    the first takes one condition, picked rather than written.
  · The docket never opens on its own. It records every multi-source prompt
    and is one click away (dkt:201).

PROPOSED RULES
  · Viewing a branch chooses nothing. Replying from a branch makes it the line
    the chat continues on; its siblings stay in the slider as they were.
  · Carrying on a sibling after that starts its own card: open:201a.
-->

.tabs{display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:0 4px;margin:0 36px 14px;border-bottom:1px solid var(--divider);overflow-x:auto}

.slider{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:stretch}
.side{position:relative}
.side .arrow{position:sticky;top:calc(45vh - 15px);display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:0 auto;border:none;border-radius:50%;background:transparent;color:var(--p-ink-3);cursor:pointer;transition:color .12s,background .12s}

.slide{display:none;animation:fade .18s ease}
.slide.on{display:block}

.tabs{position:sticky;top:0;z-index:5;background:var(--p-surface);padding-top:8px}

.srcwrap .sep{opacity:.4;margin:0 5px}
.srcwrap .srcbtn.caret{padding:4px 2px 4px 2px;max-width:none}
.srcwrap .srcbtn.caret::after{opacity:.5;margin-left:4px}
.sfield.cmd .srcwrap{display:none}

.dots button.done{background:var(--ink);border-color:var(--ink)}

/* the field, as in Almanac v30 */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper-bg) 72%,rgba(252,252,250,0))}
.dock-in{max-width:680px;margin:0 auto;position:relative}
.sfield{position:relative;display:flex;align-items:center;border-radius:var(--r-btn);background:var(--p-surface);overflow:hidden;box-shadow:0 1px 2px rgba(40,36,28,.035),0 0 0 .5px rgba(25,25,25,.10)}
.fill{position:absolute;inset:0;pointer-events:none;transition:opacity .2s}

.sfield input{position:relative;z-index:1;flex:1;min-width:0;padding:10px 6px 10px 72px;border:none;background:transparent;font:400 13.5px var(--font-sans);color:var(--ink);outline:none}
.sfield.cmd input{font-family:var(--font-mono);font-size:13px;color:#fff;padding-left:86px;text-shadow:0 0 3px rgba(12,20,40,.95)}

.shint code{font:normal 600 11px var(--font-serif);color:var(--ink)}
.shint button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}

/* ═══ The answered-by picker ═══
   From the Sept 12 streamlining mockup: a 320px popover grouped by type,
   Models and Sources (no tokens), each row with a type icon, a cost mark and
   one line of explanation. Two changes to bring it into the current rules:
   selection is an ink wash, not gold (gold is the live action only), and the
   cost mark is ink, not gold.
   Additions: a box ahead of the icon, so several can be chosen; an Order
   group; a condition line on each source after the first; a footer. */
.picker{display:none;position:absolute;right:0;bottom:calc(100% + 6px);z-index:70;width:320px;max-width:calc(100vw - 32px);
  max-height:min(620px,70vh);overflow-y:auto;border:.5px solid var(--p-border);border-radius:10px;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.08)}
.picker.open{display:block}
.pkGroup{display:flex;align-items:baseline;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--p-ink-3);padding:9px 12px 5px;background:var(--p-subtle);border-bottom:.5px solid var(--p-border-2)}
.pkGroup .marg{margin-left:auto;text-transform:none;letter-spacing:0;font-size:10.5px}
.pkItem{display:flex;gap:10px;width:100%;text-align:left;border:none;background:none;padding:9px 12px;cursor:pointer;border-bottom:.5px solid var(--p-border-2);align-items:flex-start;font:inherit;color:inherit}
.pkItem:hover{background:var(--p-subtle)}
.pkItem.on{background:var(--ink-wash)}
.pkIcon{flex:none;margin-top:1px;color:var(--p-ink-3);display:flex}
.pkItem.on .pkIcon{color:var(--ink)}
.pkBody{flex:1;min-width:0}
.pkTop{display:flex;align-items:baseline;gap:8px}
.pkName{font-size:12.5px;color:var(--ink)}
.pkOrd{font:500 10px var(--font-mono);color:var(--p-ink-3)}
.pkCost{font-size:11px;color:var(--p-ink-2);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.pkDesc{font-size:11px;color:var(--p-ink-3);line-height:1.45;margin-top:2px}
.pkItem.later{cursor:default}
.pkItem.later .pkName,.pkItem.later .pkCost{color:var(--p-ink-3)}
.pkItem.later:hover{background:none}
/* addition: the box */
.box{flex:none;width:13px;height:13px;margin-top:2px;border:1px solid var(--ink-soft);border-radius:3px;display:flex;align-items:center;justify-content:center}
.box svg{width:9px;height:9px;opacity:0}
.pkItem:hover .box{border-color:var(--ink)}
.pkItem.on .box{border-color:var(--ink)}
.pkItem.on .box svg{opacity:1}
/* a ticked box always carries its position: the priority is never hidden */
.box.num{font:600 9px/1 var(--font-sans);color:var(--paper-bg);background:var(--ink);border-color:var(--ink);font-variant-numeric:tabular-nums}
.pkItem.later .box{border-style:dashed;border-color:var(--ink-soft)}
/* addition: the radio for Order, the Almanac tick */
.tick{flex:none;width:13px;height:13px;margin-top:2px;color:var(--ink);opacity:0}
.pkItem.on .tick{opacity:1}
/* addition: the condition, marginalia that opens a picker */
.cond{display:inline-block;margin-top:3px;font:italic 400 11px var(--font-serif);color:var(--marg)}
.cond::after{content:"\25BE";font-style:normal;font-size:7px;margin-left:3px;opacity:0;transition:opacity .14s}
.pkItem:hover .cond::after{opacity:.5}
.cond:hover{color:var(--p-gold-deep)}
.pkFoot{padding:8px 12px 9px}
/* addition: kind-of-question labels inside a group, quieter than a group bar */
.pkSub{font:italic 400 11px var(--font-serif);color:var(--marg);padding:8px 12px 2px 35px}
.pkSub + .pkItem{border-top:none}

.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--p-surface);border-radius:10px;padding:9px 14px;box-shadow:0 8px 28px rgba(40,36,28,.12);font:italic 12px var(--font-serif);color:var(--p-ink-2);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
.toast.on{opacity:1}
@media (max-width:560px){

<script>
const PROMPT = 'Why could the 1883 Krakatoa eruption be heard thousands of kilometres away?';
const LONG_A = [
  'The short answer is that the final explosion released an enormous pressure wave in a fraction of a second. Close to the volcano it behaved as a shock wave. Farther out it relaxed into an ordinary sound wave, but one so strong that it stayed above the threshold of hearing for thousands of kilometres.',
  'Three things worked together. The first is sheer energy: the collapse of the caldera and the contact between seawater and magma drove the largest of the four explosions on the morning of 27 August.',
  'The second is pitch. Much of the blast was very low in frequency, and low frequencies lose far less energy over distance than high ones. Air absorbs the high end of a sound quickly, which is why distant thunder rumbles rather than cracks.',
  'The third is the atmosphere itself. Sound bends as temperature and wind change with height, and on some paths it was carried along channels in the upper air and returned to the ground far away, skipping the regions in between.',
  'The pressure pulse also kept going after it stopped being audible. Barometers around the world recorded it passing several times over the following days, as it travelled out to the opposite side of the planet and back again.',
  'So the distance is less surprising than it first sounds. The event was extremely energetic, its energy sat in the frequencies that travel best, and the atmosphere happened to guide some of it a very long way.'
];
const BR = {
  a:{id:'201a', src:'Sonnet 4.6', body:LONG_A.map(p=>'<p>'+p+'</p>').join('')},
  b:{id:'201b', src:'Wikipedia', wiki:true, body:'<p>From the article on the 1883 eruption of Krakatoa, section on the sound. Reports placed the final blast among the loudest sounds in recorded history. On Rodrigues Island, near Mauritius, people took it for distant gunfire.</p><p class="cite">Wikipedia, CC BY-SA 4.0 · revision 1249 · open the article</p>'},
  c:{id:'201c', src:'Opus 4.6', body:'<p>It helps to separate three effects: the energy of the event, the frequency content of the blast, and the state of the atmosphere that morning. Energy alone does not explain the range<span class="cursor"></span></p>'}
};
/* The Sept 12 picker's list. Sonnet's line is from that mockup; Haiku's is
   new. Names follow the Docket's sample data. */
/* Local estimates for open:… summary, from token counts. No model call. */
const EST = {a:'41% → 7%', b:'18% → 5%', c:'33% → 6%'};
const NEXT = 'd';   // the next free letter in chat 201
const PROMPT2 = 'Which places reported hearing it, and how far away were they?';
const T2 = {
  a:'<p>The best-known report came from Rodrigues Island in the Indian Ocean, close to 4,800 km from Krakatoa, where it was taken for distant gunfire. It was also heard across much of Australia and as far as Sri Lanka.</p>',
  b:'<p>From the same article: the sound was reported across a wide arc of the Indian Ocean, from Australia to the island of Rodrigues, roughly 4,800 km away.</p><p class="cite">Wikipedia, CC BY-SA 4.0 · revision 1249</p>',
  c:'<p>Reports cluster around the Indian Ocean rim. The farthest widely cited one is Rodrigues, near Mauritius<span class="cursor"></span></p>'
};
const SOURCES = [
  {k:'opus',  kind:'model',  nm:'Opus 4.6',   cost:'×15', d:'Slowest and priciest. Worth it for hard reasoning, wasteful otherwise.'},
  {k:'son',   kind:'model',  nm:'Sonnet 4.6', cost:'×3',  d:'Balanced for most work in this room.'},
  {k:'haiku', kind:'model',  nm:'Haiku 4.5',  cost:'×1',  d:'Quickest and cheapest. Good for short, plain questions.'},
  {k:'llama', kind:'model',  nm:'Llama 3.1, local', cost:'free', d:'Runs on your machine. No key, no network, costs electricity.'},
  // Sources, no tokens. Grouped by the kind of question each answers.
  {k:'wiki',  kind:'source', sub:'Reference', nm:'Wikipedia', d:'Reads the article directly. No model call, so nothing is spent. Returns a summary with a link.'},
  {k:'wdata', kind:'source', sub:'Reference', nm:'Wikidata', d:'Structured facts: dates, places, who held what. Returns labelled fields.'},
  {k:'kiwix', kind:'source', sub:'Reference', nm:'Kiwix, offline', cost:'on your machine', d:'An offline copy of Wikipedia. Works with no network at all.'},
  {k:'arxiv', kind:'source', sub:'Research', nm:'arXiv', d:'Preprints in physics, maths and computer science. Returns a list with links.'},
  {k:'epmc',  kind:'source', sub:'Research', nm:'Europe PMC', d:'Biomedical and life-science papers, many with the full text.'},
  {k:'xref',  kind:'source', sub:'Research', nm:'Crossref', d:'Resolves a DOI or a citation into the record for that paper.'},
  {k:'olib',  kind:'source', sub:'Research', nm:'Open Library', d:'Books: editions, authors, covers, and where to borrow them.'},
  {k:'brave', kind:'source', sub:'Web and discussion', nm:'Brave Search', cost:'your key', d:'Results from an independent web index. Needs your own key; Brave gives a monthly credit, then charges per search.'},
  {k:'hn',    kind:'source', sub:'Web and discussion', nm:'Hacker News', d:'What people have said about something, via Algolia. Discussion, not answers.'},
  {k:'news',  kind:'source', sub:'Web and discussion', nm:'News', cost:'later', later:true, d:'Recent headlines from public feeds. Best for what happened, not why.'},
  {k:'overse',kind:'source', sub:'Media and data', nm:'Openverse', d:'Openly licensed images and audio, each with its licence.'},
  {k:'meteo', kind:'source', sub:'Media and data', nm:'Open-Meteo', d:'Current weather and forecasts. Returns numbers, not prose.'}
];
const CONDS = ['if nothing is found','if it fails','after it finishes','always'];

let view = 'pick', cur = 'a', chosen = null, cmd = false;
let to = null;   // null: the reply follows the slide you're viewing. An array once you tick.
let picked = ['son','wiki','opus'], order = 'together', conds = {};
const $ = s => document.querySelector(s);
const stage = $('#stage'), inp = $('#inp'), field = $('#field'), picker = $('#picker');

const arrowSvg = d => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

function slides(){
  if (view === 'order') return [
    {k:'a', id:'201a', src:'Wikipedia', st:'nothing found', cls:'done', html:'<div class="ans empty">Wikipedia found no article matching this prompt.</div>'},
    {k:'b', id:'201b', src:'Sonnet 4.6', st:'running', cls:'', html:'<div class="ans"><p>The final explosion released an enormous pressure wave in a fraction of a second. Close to the volcano it behaved as a shock wave<span class="cursor"></span></p></div>'},
    {k:'c', id:'201c', src:'Opus 4.6', st:'waiting', cls:'wait', html:'<div class="ans waitbox">Waiting. Runs if 201b fails.</div>'}
  ];
  const both = view==='all';
  return ['a','b','c'].map(k => ({k, id:BR[k].id, src:BR[k].src,
    st: k==='c' ? 'running' : '', cls: k==='c' ? '' : 'done',
    html:`<div class="ans ${BR[k].wiki?'wiki':''}">${both && k==='c' ? BR[k].body.replace('<span class="cursor"></span>','.') : BR[k].body}</div>`
      + (both ? `<div class="turn2"><div class="you">${PROMPT2}</div><div class="ans ${BR[k].wiki?'wiki':''}">${T2[k]}</div></div>` : '')}));
}

function renderChat(){
  const S = slides(), i = S.findIndex(s=>s.k===cur);
  const first = i===0, last = i===S.length-1;
  stage.innerHTML = `
  <section class="lcard"><div class="chead">
    <button class="ctitle" data-cmd="sym:Research">Sym:<span class="c"> Research</span></button>
    <div class="marg"><span>chat 201</span><span class="sep">·</span><button data-cmd="dkt:201">dkt:201</button></div>
  </div><div class="cbody">
    <div class="you">${PROMPT}</div>
    <div class="tabs" role="tablist">${S.map(s=>`
      <button class="tab ${s.k===cur?'on':''} ${s.cls==='wait'?'wait':''}" data-k="${s.k}" role="tab">
        <span class="id">${s.k}</span>${s.src}
        ${chosen===s.k?'<span class="cont">continued</span>':''}
        ${s.st?`<span class="st">${s.st}</span>`:''}
      </button>`).join('')}</div>
    <div class="slider" id="slider">
      <div class="side"><button class="arrow" data-step="-1" aria-label="Previous reply" ${first?'disabled':''}>${arrowSvg('M10 3 5 8l5 5')}</button></div>
      <div class="track">${S.map(s=>`
        <div class="slide line ${s.k===cur?'on':''}">${s.html}
          <div class="marg">${siblingNote(s)}${openMarg(s)}</div>
        </div>`).join('')}

      </div>
      <div class="side"><button class="arrow" data-step="1" aria-label="Next reply" ${last?'disabled':''}>${arrowSvg('M6 3l5 5-5 5')}</button></div>
    </div>
    ${chosen ? `
    <div class="thread">
      <div class="you">Which of those places reported hearing it, and how far away were they?</div>
      <div class="ans wiki"><p>From the same article: the sound was reported across a wide arc of the Indian Ocean, from Australia to the island of Rodrigues, roughly 4,800 km away.</p><p class="cite">Wikipedia, CC BY-SA 4.0 · revision 1249</p></div>
    </div>` : ''}
  </div></section>`;
  bindSwipe();
}
function openMarg(s){
  if (s.cls==='wait') return `<button data-cmd="open:${s.id}">open:${s.id}</button>`;
  return `<button data-cmd="open:${s.id}">open:${s.id}</button><span>with its history</span><span class="sep">·</span>`
    + `<button data-cmd="open:${s.id} summary">open:${s.id} summary</button><span class="est">context ${EST[s.k]||'about half'}</span>`;
}
function siblingNote(s){
  if (!chosen || s.k===chosen) return '';
  return `<span>the chat continues from 201${chosen}; carrying this one on starts its own card</span><span class="sep">·</span>`;
}
function bindSwipe(){
  const el = $('#slider'); if (!el) return; let x0=null, y0=null;
  el.addEventListener('touchstart', e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  el.addEventListener('touchend', e=>{ if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if (Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) step(dx<0?1:-1); x0=null; },{passive:true});
}
function step(d){
  const S = slides(), i = S.findIndex(s=>s.k===cur), j = i+d;
  if (j<0 || j>=S.length) return;
  cur = S[j].k; document.documentElement.style.setProperty('--dx', d>0?'14px':'-14px');
  renderChat(); renderPicker(); hint();
}

function renderEmpty(){
  stage.innerHTML = `<section class="lcard"><div class="chead">
    <button class="ctitle" data-cmd="sym:Research">Sym:<span class="c"> Research</span></button>
    <div class="marg"><span>new chat</span></div></div>
    <div class="cbody"><div class="you" style="background:none;text-align:center;color:var(--p-ink-3);font:italic 13px var(--font-serif)">Write a prompt below. The sources are in the field, to the left of the quill.</div></div></section>`;
}

/* the picker */
const replying = () => view==='slider' || view==='reply' || view==='all';
const targets = () => to || [chosen || cur];
function srcLabel(){
  if (replying()){
    const t = targets();
    if (t.length===3) return 'to all three';
    if (t.length===1) return 'to 201'+t[0]+' · '+BR[t[0]].src.replace(/ \d.*$/,'');
    return 'to '+t.map(k=>'201'+k).join(', ');
  }
  const names = SOURCES.filter(s=>picked.includes(s.k)).sort((a,b)=>picked.indexOf(a.k)-picked.indexOf(b.k)).map(s=>s.nm.replace(/ \d.*$/,'').replace(', local',''));
  if (!names.length) return 'choose a source';
  const sep = order==='together' ? ', ' : ' then ';
  return names.length>2 ? names.slice(0,2).join(sep)+' +'+(names.length-2) : names.join(sep);
}
const ICON = {
  model:'<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5" y="5" width="10" height="10" rx="1.6"/><path d="M8 2.2v2.8M12 2.2v2.8M8 15v2.8M12 15v2.8M2.2 8H5M2.2 12H5M15 8h2.8M15 12h2.8"/></svg>',
  source:'<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 3.6H4.6v12.8h3"/><path d="M12.4 3.6h3v12.8h-3"/></svg>'
};
const CHECK = '<svg viewBox="0 0 12 12" fill="none"><polyline points="2,6.5 5,9.5 10,3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const BOX = '<span class="box">'+CHECK+'</span>';
const MTICK = '<svg class="tick" viewBox="0 0 12 12" fill="none"><polyline points="2,6.5 5,9.5 10,3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function renderSrc(){
  const w = $('#srcwrap');
  if (!replying()){
    w.innerHTML = `<button class="srcbtn" id="srcbtn" aria-haspopup="true">${srcLabel()}</button>`;
  } else {
    const t = targets(), all = t.length===3;
    const one = all ? 'to 201'+cur : (t.length===1 ? 'to 201'+t[0] : 'to '+t.map(k=>'201'+k).join(', '));
    w.innerHTML = `<button class="tg ${all?'':'on'}" data-toone="1">${one}</button><span class="sep">·</span>`
      + `<button class="tg ${all?'on':''}" data-toall="1">all three</button>`
      + `<button class="srcbtn caret" id="srcbtn" aria-haspopup="true" aria-label="Choose which branches"></button>`;
  }
  if (picker.classList.contains('open')) $('#srcbtn').classList.add('open');
  placeholder();
}
function placeholder(){
  if (cmd) return;
  if (!replying()){ inp.placeholder = view==='pick' ? 'Ask anything' : 'Reply'; return; }
  const t = targets();
  inp.placeholder = t.length===3 ? 'Reply to all three' : 'Reply to '+t.map(k=>'201'+k).join(' and ');
}
function renderReplyTo(){
  const t = targets();
  const row = k => {
    const on = t.includes(k), n = t.indexOf(k), b = BR[k];
    const d = chosen && k!==chosen ? 'The chat continues from 201'+chosen+'. Carrying this one on starts its own card.'
      : k===cur && !to ? 'The reply you are viewing. The reply follows it as you slide.'
      : chosen===k ? 'The line this chat continues on.' : 'Its own thread, under this prompt.';
    return `<button class="pkItem ${on?'on':''}" data-to="${k}" role="menuitemcheckbox" aria-checked="${on}">
      ${on ? `<span class="box num">${n+1}</span>` : BOX}<span class="pkIcon">${ICON[b.wiki?'source':'model']}</span>
      <span class="pkBody"><span class="pkTop"><span class="pkName">201${k} · ${b.src}</span></span><span class="pkDesc">${d}</span></span></button>`;
  };
  picker.innerHTML = `<div class="pkGroup">Reply to<div class="marg">${t.length<3?'<button data-toall="1">all three</button>':`<button data-toone="1">just 201${cur}</button>`}</div></div>`
    + ['a','b','c'].map(row).join('')
    + `<div class="pkFoot marg"><span>${to?'held until you change it':'follows the slide you view'}</span><span class="sep">·</span><span>new sources: <code>p&gt;</code> a fresh prompt</span></div>`;
  renderSrc();
}
function renderPicker(){
  if (replying()) return renderReplyTo();
  const seq = order==='sequence' && picked.length>1;
  const item = s => {
    const on = picked.includes(s.k), n = picked.indexOf(s.k);
    const cond = seq && on && n>0 ? `<span class="cond" data-cond="${s.k}" role="button" tabindex="0">runs ${conds[s.k]||CONDS[0]}</span>` : '';
    return `<button class="pkItem ${on?'on':''} ${s.later?'later':''}" ${s.later?'aria-disabled="true"':`data-src="${s.k}"`} role="menuitemcheckbox" aria-checked="${on}">
      ${on ? `<span class="box num">${n+1}</span>` : BOX}<span class="pkIcon">${ICON[s.kind]}</span>
      <span class="pkBody"><span class="pkTop"><span class="pkName">${s.nm}</span>${s.cost?`<span class="pkCost">${s.cost}</span>`:''}</span>
      <span class="pkDesc">${s.d}</span>${cond}</span></button>`;
  };
  const group = (kind, title, note) => {
    let last = null, h = `<div class="pkGroup">${title}${note?`<div class="marg"><span>${note}</span></div>`:''}</div>`;
    SOURCES.filter(s=>s.kind===kind).forEach(s => {
      if (s.sub && s.sub!==last){ h += `<div class="pkSub">${s.sub}</div>`; last = s.sub; }
      h += item(s);
    });
    return h;
  };
  const orderGroup = picked.length>1 ? `<div class="pkGroup">Order<div class="marg"><span>${picked.length} ticked</span></div></div>
    <button class="pkItem ${order==='together'?'on':''}" data-order="together" role="menuitemradio">${MTICK}<span class="pkBody"><span class="pkTop"><span class="pkName">All at once</span></span><span class="pkDesc">One reply from each, in a slider, in the numbered order.</span></span></button>
    <button class="pkItem ${order==='sequence'?'on':''}" data-order="sequence" role="menuitemradio">${MTICK}<span class="pkBody"><span class="pkTop"><span class="pkName">One after another</span></span><span class="pkDesc">Each waits for the one before it, and runs only if its condition is met.</span></span></button>` : '';
  picker.innerHTML = group('model','Models') + group('source','Sources, no tokens','no model call') + orderGroup +
    `<div class="pkFoot marg"><span>${picked.length>1?'kept as steps in':'part of'}</span><button data-cmd="dkt:201">dkt:201</button><span class="sep">·</span><span>opens only when asked</span></div>`;
  renderSrc();
}
function togglePicker(open){
  picker.classList.toggle('open', open);
  const sb=$('#srcbtn'); if (sb) sb.classList.toggle('open', open);
  hint();
}

function hint(){
  const h = $('#hint');
  if (cmd){
    const v = inp.value.trim().replace(/^>/,''), m = v.match(/^open:201([abc])(\s+summary)?$/);
    if (m && m[2]) h.innerHTML = `<span class="now">Enter starts 201${NEXT} on its own card from a summary of 201${m[1]}</span><span class="sep">·</span><span>context ${EST[m[1]]}</span><span class="sep">·</span><span>one model call to write it</span>`;
    else if (m) h.innerHTML = `<span class="now">Enter opens 201${m[1]} on its own card with its full history</span><span class="sep">·</span><span>no call; it keeps its letter</span>`;
    else h.innerHTML = `<span>Enter runs it</span><span class="sep">·</span><span>Escape goes back to the prompt</span>`;
    return;
  }
  if (picker.classList.contains('open') && !replying()){
    h.innerHTML = order==='sequence' && picked.length>1
      ? `<span>Enter sends to ${picked.length} sources in order</span><span class="sep">·</span><span>each one after the first runs only if its condition is met</span>`
      : `<span>Enter sends this one prompt to ${picked.length} source${picked.length>1?'s':''}</span><span class="sep">·</span><span>replies arrive in a slider</span>`;
    return;
  }
  if (view==='pick'){ h.innerHTML = `<span>click the sources to tick more than one</span><span class="sep">·</span><span>type <code>&gt;</code> for commands</span>`; return; }
  if (view==='order'){
    h.innerHTML = `<span class="now">no results from Wikipedia: started 201b with Sonnet</span><span class="sep">·</span><button data-cmd="stop:201">stop:201</button>`; return;
  }
  const t = targets(), sw = '<span>⌥← ⌥→ switches replies</span>';
  if (t.length>1){
    h.innerHTML = `<span class="now">Enter sends to ${t.map(k=>'201'+k).join(', ')}; each answer lands on its own slide</span><span class="sep">·</span><button data-toone="1">just 201${cur}</button>`; return;
  }
  const k = t[0];
  if (chosen && cur!==chosen && !to){
    h.innerHTML = `<span>continues <code>201${chosen}</code>, not the reply you're viewing</span><span class="sep">·</span><button data-cmd="open:201${cur}">open:201${cur} to carry this one on</button>`; return;
  }
  h.innerHTML = `<span>continues <code>201${k}</code> with ${BR[k].src}</span><span class="sep">·</span>${chosen?sw:'<button data-toall="1">reply to all three</button><span class="sep">·</span>'+sw}`;
}

function render(){
  if (view==='pick'){ renderEmpty(); togglePicker(true); }
  else { togglePicker(false); renderChat(); }
  document.querySelectorAll('.mock button').forEach(b=>b.classList.toggle('on', b.dataset.view===view));
  placeholder();
  renderPicker(); hint();
}

function setView(v){
  to = null; togglePicker(false);
  view = v; cmd = false; field.classList.remove('cmd'); $('#chip').textContent='PROMPT';
  if (v==='pick'){ picked=['son','wiki','opus']; order='together'; chosen=null; cur='a'; }
  if (v==='slider'){ picked=['son','wiki','opus']; order='together'; chosen=null; cur='a'; }
  if (v==='reply'){ picked=['wiki']; order='together'; chosen='b'; cur='b'; }
  if (v==='all'){ picked=['son','wiki','opus']; order='together'; chosen=null; cur='a'; to=['a','b','c']; }
  if (v==='order'){ picked=['wiki','son','opus']; order='sequence'; conds={son:'if nothing is found', opus:'if it fails'}; chosen=null; cur='b'; }
  inp.value=''; render();
}

function cmdMode(on, text){
  cmd = on; field.classList.toggle('cmd', on);
  $('#chip').textContent = on ? 'COMMAND' : 'PROMPT';
  inp.value = on ? (text||'') : '';
  if (on) inp.placeholder = 'open:, dkt:, alm:'; else placeholder();
  if (on) togglePicker(false);
  hint(); inp.focus();
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2800); }
function run(c){
  c = c.trim().replace(/^>/,'');
  const m = c.match(/^open:(201[abc])(\s+summary)?$/);
  if (m && m[2]) toast('201'+NEXT+' would open as its own card, starting from a summary of '+m[1]+'.');
  else if (m) toast(m[1]+' opens as its own card, with the whole chat up to that reply.');
  else if (/^dkt:/.test(c)) toast('Brings the docket onto the screen beside the chat. Nothing opens it for you.');
  else if (/^stop:/.test(c)) toast('Stops the running step and parks the rest as paused.');
  else if (/^(alm|lib|lab|sym):/.test(c)) toast(c+' brings that board onto the screen.');
  else toast('Not a command in this mockup: '+c);
}
function send(){
  if (view==='pick'){ setView(order==='sequence'&&picked.length>1 ? 'order' : 'slider'); toast('Sent once, to '+picked.length+' sources.'); return; }
  if (replying() && targets().length===3 && view==='slider'){ setView('all'); toast('Sent to all three. Each carries on in its own tab.'); return; }
  if (replying() && targets().length>1){ toast('Sent to '+targets().length+' branches. Each keeps its own thread; the slider stays.'); inp.value=''; return; }
  if (view==='slider' && !chosen){ chosen=targets()[0]; cur=chosen; to=null; picked=[{a:'son',b:'wiki',c:'opus'}[cur]]; view='reply'; render(); toast('201'+chosen+' is now the line this chat continues on.'); return; }
  toast('Sent.');
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]'); if (v){ setView(v.dataset.view); return; }
  const tb = e.target.closest('.tab'); if (tb){ cur = tb.dataset.k; renderChat(); renderPicker(); hint(); return; }
  const tr = e.target.closest('[data-to]');
  if (tr){ const k=tr.dataset.to, t=targets().slice(); const i=t.indexOf(k);
    if (i>-1){ if (t.length>1) t.splice(i,1); } else t.push(k);
    to = t; renderPicker(); hint(); return; }
  if (e.target.closest('[data-toall]')){ e.stopPropagation(); to=['a','b','c']; renderPicker(); hint(); inp.focus(); return; }
  if (e.target.closest('[data-toone]')){ e.stopPropagation(); to=null; renderPicker(); hint(); inp.focus(); return; }
  const a = e.target.closest('.arrow'); if (a){ step(+a.dataset.step); return; }
  if (e.target.closest('#srcbtn')){ togglePicker(!picker.classList.contains('open')); return; }
  const cd = e.target.closest('[data-cond]');
  if (cd){ e.stopPropagation(); const k=cd.dataset.cond, i=CONDS.indexOf(conds[k]||CONDS[0]); conds[k]=CONDS[(i+1)%CONDS.length]; renderPicker(); return; }
  const r = e.target.closest('[data-src]');
  if (r){
    const k = r.dataset.src;
    picked = picked.includes(k) ? picked.filter(x=>x!==k) : [...picked, k];
    renderPicker(); hint(); return;
  }
  const o = e.target.closest('[data-order]'); if (o){ order=o.dataset.order; renderPicker(); hint(); return; }
  const c = e.target.closest('[data-cmd]'); if (c){ cmdMode(true, c.dataset.cmd); return; }
  if (picker.classList.contains('open') && !e.target.closest('.picker') && view!=='pick') togglePicker(false);
});
inp.addEventListener('input', () => { if (!cmd && inp.value.startsWith('>')) cmdMode(true, inp.value.slice(1)); else if (cmd) hint(); });
inp.addEventListener('keydown', e => {
  if (e.altKey && (e.key==='ArrowLeft'||e.key==='ArrowRight') && replying()){ e.preventDefault(); step(e.key==='ArrowRight'?1:-1); return; }
  if (e.key==='Escape'){ if (cmd) cmdMode(false); else togglePicker(false); }
  if (e.key==='Enter'){ if (cmd){ run(inp.value); cmdMode(false); } else send(); }
});
document.addEventListener('keydown', e => {
  if (document.activeElement===inp && inp.value) return;
  if (view!=='pick' && (e.key==='ArrowLeft'||e.key==='ArrowRight')) step(e.key==='ArrowRight'?1:-1);
});
render();
</script>
</body>
</html>
