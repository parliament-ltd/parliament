<!--

PARLIAMENT · THE LAB v6
Supersedes parliament_lab_v5.html. The canvas style switch stays for now;
medium is the decided style.

CHANGES FROM v5
  · Ticking. Blocks, layouts and themes in the Library have checkboxes.
    Rooms, boards and resources do not, because they do not go into a room.
    A line under the filters says what is ticked, with "add to room" and
    "clear". The ticks survive a change of filter or search, as in the
    Almanac. "add to room" writes add: with everything ticked; the Enter
    line resolves it at once (a layout, a theme, blocks to their first free
    place) and refuses two layouts or two themes.
  · add: puts things into whatever the navy rule is on: the room when the
    Canvas is addressed, the collection when that is. place: stays for
    choosing a slot.
  · The Library's marginalia is facts only. use, paint, place and collect
    are gone. Rooms keep one action (edit here, or duplicate); boards keep
    open.
  · Details open in place, under the item you clicked, while the Library is
    in its slot. Popped out, the Library shows details in a side column
    beside the grid. Clicking the row opens details; the checkbox selects.
    The details section at the top of the Library is gone.
  · The room line: pickers on the left (layout, theme, built for), actions
    at the right end (name, inspect). Rail buttons moved into the room's
    details. Each picker's menu opens with a heading naming what it changes,
    so the line can show values without keys.
  · name: replaces rename:. It names whatever the navy rule is on: the room,
    or the collection; with an id it names an Almanac item.
  · Trying a room with p> keeps the exchange as chats, tagged "tried in the
    Lab", and the Enter line says it spends tokens.

PARLIAMENT · THE LAB v5 (notes kept)
v4 without the collection.

CHANGES FROM v4
  · The Lab arrangement is two boards: Library and Canvas. They are the
    focus and need to be solid first.
  · The collection is not part of the Lab. It can still be called:
    open:collection brings it beside the Canvas, and add: or compare: open it
    too. It is not reported as missing when it is not there.
  · "collect" is gone from the Library's marginalia, to keep the Library
    about browsing and placing.

PARLIAMENT · THE LAB v4 (notes kept)

CHANGES FROM v3
  · The canvas has three drawing styles, switched from the Try row, so they
    can be compared in place. Medium is the default and the proposal:
      earlier   the v2 canvas: well, raised room, filled slots, raised
                blocks, accent dots, placeholder bars, bubbles
      medium    the earlier depth with the Almanac's type: the well, the
                lifted room, soft slot areas, raised blocks, accent dots and
                bubbles stay; slot labels are letter-spaced, a block's state
                is one line of italic marginalia instead of bars, features
                are tags, selection is the navy rule
      lines     the v3 canvas: dotted outline, hairline rules, rows
    Only one style ships. The switch exists to choose.
  · Everything outside the canvas is as in v3.

(v3 notes follow.)

PARLIAMENT · THE LAB v3
Applies arrangements-boards-blocks-decisions.md (28 Sept 2026, later
session) and the review of v2. Follows parliament_almanac_v30.html for visual
values. Supersedes parliament_lab_v2.html. Reference material, not
production code.

CHANGES FROM v2
  · The Lab is an arrangement, not a board. It holds three boards: Library,
    Canvas and Collection. The middle board is called Canvas, plainly, so it
    can be called: pop:canvas, move:canvas left.
  · No "pop out" on any board, as in the Almanac. Popping is found through
    the field and the reference. A clear board name is what matters.
  · Clicks that only move things around the screen act at once: "bring it
    back" on a popped window or under the field, "open it" for a closed
    board. Clicks that change a room still write the command and wait for
    Enter.
  · The Canvas: its name in the top row; under the rule, one line, centred
    vertically, with the room's name and its pickers (layout, theme, device,
    rail buttons, rename, inspect). Select a block and the same line reads
    "Writing Studio / Highlights" with that block's pickers. One place for
    marginalia; it changes what it says rather than moving. The v2 head and
    foot pickers are gone.
  · The Library: its name in the top row, then a details section (what the
    inspector showed), then the filters, then the catalogue. inspect: shows
    things there, opening the Library if it is closed. With nothing selected
    the section is one quiet line, so the catalogue does not jump. The v2
    overlay under the field is gone.
  · The Canvas is drawn in the Almanac's language: a dotted outline, hairline
    rules between slots and between blocks, letter-spaced slot labels, a
    block's state as one line of italic marginalia, the transcript as rows
    with a mono speaker column, features as tags (dashed off, ruled on),
    washes only for selection and for where a block fits. The grey well,
    raised boxes, filled slots, sketch bars, bubbles and dots are gone. The
    room keeps its own theme inside its edges.

WORKING NAMES (placeholders; one copy table in the product)
  arrangement   what is on your screen or screens, popped windows included
  board         something built from blocks: Library, Collection, Almanac,
                Docket, and every room
  room          a board built around a conversation
  block         a piece: messages, input, highlights, notes, the step list
  feature       something a block can do, set with set:. Web search is a
                feature of the input block
  theme         colour and type inside a room (was "scheme")
  layout        where blocks go inside a room (was "floor plan")

CHANGES IN v2, FROM v1
  · The inspector is gone. Its jobs moved:
      the room's own settings   marginalia pickers in the room board's head
                                (name, layout, theme, device, rail buttons)
      the selected block's      marginalia pickers in the room board's foot
                                (where it sits, its settings and features)
      one thing in detail       inspect:, an overlay under the field, the
                                Almanac's peek under a better name. Clicking
                                anything in the Library opens it; Escape
                                closes it
      several things at once    the collection
    The foot is one answer to the open question of where a selected block's
    marginalia lives. It keeps the room's own theme free of Lab chrome.
  · Features. Web search, file attach and voice input are features of the
    input block, drawn as toggles inside it. Clicking one writes
    set:input web search on. In the Library they are listed on the input
    block's entry, and searching "web search" finds it with the line marked.
    place:web search still works and says it is switching a feature on.
  · Messages and input are two blocks every room must have: rm: refuses them.
  · Where a block fits. Hover a block in the Library, hover its place
    marginalia, or type place: with a block named, and its slots light up:
    the best free slot strongest, other fitting slots gently, full or
    unsuitable ones dimmed with a one-line reason. A slot word narrows it.
    Navy, not gold. This keeps what the old Lab did on drag.
  · Verbs renamed or retired: plan: is layout:, scheme: is theme:, peek: is
    inspect:, lab:"name" is edit:"name" (and edit: takes boards), hide: and
    show: are close: and open:, hold: is gone.
  · rm: follows the navy rule. With the room addressed it takes a block out
    of the room; with the collection addressed, out of the collection. The
    Library keeps the block either way. A layout change that leaves a block
    without a place takes it out of the room, and undo: puts it back; there
    is no holding tray.
  · The Library lists Boards (Almanac, Library, Collection, Docket) with open
    and edit, and every block says where it can go: room only, a room or the
    screen, the screen only.
  · The step list is a block, so a room can carry its docket's steps. The
    docket itself is a board.
  · The guide gains a step for web search, to show a feature being set.

STILL AS IN v1
  The field's three modes, commands written by clicks and run by Enter, the
  Library as one board that becomes a grid when popped, the collection with
  its source, numbering, sections and notes in context, the guide, the empty
  room, pop-outs drawn inside the page.

NOT BUILT HERE
  open: and edit: on the Almanac and Docket boards, arrange:, export:, pin:,
  tour:, real windows, multi-select.
-->
<style>

/* ═══ Carried from Almanac v30 ═══ */
:root{
  --paper-bg:#FCFCFA;
  --paper-ink:rgba(46,58,79,.011);
  --paper-hatch:none;   /* page hatch retired — it was noise, not texture */
  --card-lift:0 1px 2px rgba(40,36,28,.035);
  --p-surface:#FFFFFF;
  --p-subtle:#FAF9F5;          /* heading rows — off-white, warmer than grey */
  --p-tray:#F6F5F1;            /* the working-set tray, so white cards read  */
  --p-ink:#191919; --p-ink-2:#787774; --p-ink-3:#9B9A97; --p-line-soft:#C0C8D4;
  --p-border:#E9E9E7; --p-border-2:#F1F1EF;
  --p-gold-light:#B8A070; --p-gold-muted:#9C8760; --p-gold-deep:#8B6A10;
  --p-gold-tint:rgba(196,169,77,.08); --p-gold-tint-2:rgba(196,169,77,.14);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r-sm:4px; --r-md:6px; --r-xl:16px; --r-btn:8px;

  /* Command mode. Ruling only, no field behind it — the crosshatch carries
     the mode on its own and the type goes white over it. */
  --navy:38,56,92;
  --line-c:22,38,70;
  --line-a:1;
  --line-w:3px;
  --hatch-gap:3.5px;

  /* Prompt mode. Same idea as command — the fill carries the mode — but bone
     rather than navy, ruled into tall parallelograms with a diagonal through
     each, so the type stays ink and the field still reads as paper. */
  --tri:rgba(122,120,114,.17);
  --prm-bg:var(--paper-bg);

  /* Border and paper spec, light mode. Dark is unfinished and not referenced. */
  --ink:#191919;
  --ink-dot:rgba(25,25,25,.18);      /* structural: evenly spaced dots       */
  --ink-prog:rgba(25,25,25,.10);     /* key: progressive dash, one at a time  */
  --divider:rgba(25,25,25,.08);      /* header rules                          */
  --ink-soft:rgba(25,25,25,.30);     /* checkbox rule, quiet icons            */
  --ink-wash:rgba(25,25,25,.045);    /* selected rows and cards               */
  --ink-wash-2:rgba(25,25,25,.075);
  --marg:rgba(25,25,25,.46);         /* marginalia at rest                    */

  /* GOLD MEANS THE LIVE ACTION, AND NOTHING ELSE.
     The search field when engaged, the trigger on hover, keyboard focus.
     Every other former use is ink. */
}

*{box-sizing:border-box;margin:0;padding:0}

/* Borders are drawn as an SVG overlay, never as a CSS border. Patterns are
   computed from the element's real perimeter so they always close cleanly. */
[data-border]{position:relative}
svg.bx{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}

/* The key border is static. Nothing draws, nothing fades. */

/* The faint borders cannot carry focus. Keyboard focus gets its own ring. */
:focus-visible{outline:2px solid var(--p-gold-deep);outline-offset:2px}
/* Focus is a live action, so it keeps gold. Nothing else at rest does. */
body{
  font-family:var(--font-sans);background-color:var(--paper-bg);
  background-image:var(--paper-hatch);background-attachment:fixed;
  color:var(--p-ink);-webkit-font-smoothing:antialiased;padding:44px 16px 64px;
}

.card{background:var(--p-surface);border-radius:var(--r-xl);box-shadow:var(--card-lift);overflow:hidden}

.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;
  font:500 10px var(--font-mono);background:var(--p-subtle);border:.5px solid var(--p-border);border-radius:3px;color:var(--p-ink-3)}


.sbar{padding:0;position:relative}
.sfield{position:relative;display:flex;align-items:center}
.sfield>svg:not(.bx){position:absolute;right:12px;top:50%;margin-top:-7.5px;width:15px;height:15px;color:var(--ink);pointer-events:none}
.sfield{border-radius:var(--r-btn)}
.sfield input{width:100%;padding:10px 38px 10px 68px;font:400 13.5px var(--font-sans);
  border:none;border-radius:var(--r-btn);background:transparent;color:var(--p-ink)}
.sfield input:focus{outline:none}
/* ═══ The field is also the command line ═══
   Plain text searches. A leading > switches it into command mode: the box
   fills with a navy crosshatch and the type goes white. Deleting the > puts
   it straight back to prose. The first-character rule is what makes that
   safe — a > anywhere else is just a character. */
.sfield{
  background-color:var(--p-surface);   /* plain at rest; only command mode is ruled */
  overflow:hidden;
}
.sfield .fillwrap{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  clip-path:inset(0 100% 0 0);
  transition:clip-path .28s cubic-bezier(.4,0,.2,1);
}
.sfield.cmd .cmdwrap{clip-path:inset(0 0 0 0)}
.sfield.prm .prmwrap{clip-path:inset(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.sfield .fillwrap{transition:none}}
.sfield .fill{position:absolute;inset:0}
.sfield .fill>svg{width:100%;height:100%;display:block}
/* Command: a hexagonal lattice marked only at its edge points, two dots a side,
   one dot size throughout, about a quarter of them left dark. The hexagons
   themselves are never drawn. */
.sfield .cmdfill{background:rgb(var(--line-c))}
/* Prompt: the page's own bone, ruled into vertical parallelograms. */
.sfield .prmfill{background:var(--prm-bg)}
.sfield input{position:relative;z-index:1}
.sfield>svg:not(.bx),.sfield .modechip{z-index:2}
.sfield.cmd input{
  font-family:var(--font-mono);font-size:13px;color:#fff;
  text-shadow:0 0 3px rgba(12,20,40,.95),0 1px 2px rgba(12,20,40,.85);
}
.sfield.cmd input::placeholder{color:#fff;opacity:.95;text-shadow:0 0 3px rgba(12,20,40,.9)}
.sfield.cmd>svg:not(.bx){color:#fff;filter:drop-shadow(0 0 2px rgba(12,20,40,.9))}
.modechip{
  position:absolute;left:12px;top:50%;margin-top:-8px;font:600 8.5px var(--font-sans);letter-spacing:.06em;
  padding:3px 7px;border-radius:9px;background:rgb(var(--navy));color:#fff;
  opacity:0;transform:translateX(-4px);transition:opacity .16s ease,transform .16s ease;pointer-events:none;
}
.sfield .schip{opacity:1;transform:none}
.sfield.cmd .schip,.sfield.prm .schip{opacity:0;transform:translateX(-4px)}
.sfield.cmd .cmdchip{opacity:1;transform:none}
.sfield.cmd input{padding-left:82px}
.sfield.cmd>svg:not(.bx){opacity:0}
.sfield>svg:not(.bx){transition:opacity .16s ease}
/* Prompt names itself in ink, the way command names itself in navy. Search is
   the resting mode, so its pill is drawn rather than filled: bone inside, an
   ink rule around it, ink type. Gold is still only the live action. */
.sfield .pchip{background:var(--ink);color:var(--paper-bg)}
.sfield .schip{background:var(--paper-bg);color:var(--ink);border:1px solid var(--ink);padding:2px 6px}

/* ═══ The field is also the prompt ═══
   p> at the front switches it. Same pill as command, quill on the right where
   the magnifier sits, type left in ink. Deleting the leader puts it back. */
.sfield>svg.quillmark{right:10px;width:21px;height:21px;margin-top:-10.5px;color:var(--ink);opacity:0}
.sfield.prm>svg.quillmark{opacity:1}
.sfield.prm>svg.mag{opacity:0}
.sfield.prm .pchip{opacity:1;transform:none}
.sfield.prm input{padding-left:72px;padding-right:42px;color:var(--p-ink)}

/* Marginalia under the field. One line of reserved height that changes
   what it says rather than appearing, so nothing below it moves. At rest it
   says how to reach the command line; in command mode it lists the commands,
   narrowing as you type. Schemes are upright because they are literal text
   to type; the gloss beside each is italic, like all marginalia. */
.shint{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px;min-height:19px;padding:6px 13px 0;
  font:italic 400 11px var(--font-serif);color:var(--marg);line-height:1.6}
.shint:hover{color:var(--p-gold-deep)}
.shint .it{white-space:nowrap}
.shint .sep{opacity:.5;margin:0 3px 0 1px}
.shint code{font:normal 600 11px var(--font-serif);color:inherit;letter-spacing:.01em}
.shint button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
.shint button:hover{color:var(--ink)}
.shint button:hover .gl{text-decoration:underline;text-underline-offset:2px}
.shint .it.first code{color:var(--ink)}
.shint .none{white-space:nowrap}
.shint .pre{color:var(--ink);font-style:italic}
.shint .bad{color:var(--ink)}

/* The full reference. Asked for with ?, so it may cover the table; it floats
   rather than pushing anything down, and it goes the moment you type past it. */
.cref{display:none;position:absolute;left:0;right:0;top:66px;z-index:60;background:var(--p-surface);
  border-radius:var(--r-btn);padding:13px 16px 12px;box-shadow:0 8px 28px rgba(40,36,28,.08);
  max-height:64vh;overflow:auto}
.cref.open{display:block}
.topgrid.atbottom .cref{max-height:58vh}

/* Header: what this is, and a way to keep only one group */

.cref .rhead{padding-bottom:8px;margin-bottom:11px;border-bottom:.5px solid var(--p-border-2)}
.cref .rtop{display:flex;align-items:baseline;gap:10px}
.cref .rlab{font:600 9px var(--font-sans);letter-spacing:.055em;color:var(--ink)}
.cref .rlab .n{margin-left:5px;font-family:var(--font-mono);font-size:9px;color:var(--p-ink-3)}
.cref .chips{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.cref .chip{display:inline-block;width:auto;grid-template-columns:none;text-align:center;
  font:italic 400 11px var(--font-serif);color:var(--marg);border:none;background:none;
  padding:2px 8px;border-radius:9px;cursor:pointer}
.cref .chip:hover{color:var(--ink)}
.cref .chip.on{color:var(--ink);background:rgba(25,25,25,.055)}

/* Groups flow in columns; a group never splits across one */
.cref .cols{columns:318px;column-gap:28px}
.cref .grp{break-inside:avoid;margin:0 0 15px}

/* ═══════════════════════════════════════════════════════════════════
   THE LAB
   ═══════════════════════════════════════════════════════════════════ */
body{font-family:var(--font-sans);background:var(--paper-bg);color:var(--p-ink);
  -webkit-font-smoothing:antialiased;padding:0 16px 120px}
.page{max-width:1500px;margin:0 auto}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(8px);padding:7px 14px;
  border-radius:var(--r-md);background:var(--p-ink);color:#fff;font-size:12px;opacity:0;pointer-events:none;
  transition:opacity .16s,transform .16s;z-index:90;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* The field sits over the canvas column, as it sits over the table in the
   Almanac: it acts on what is in the middle unless something else is
   addressed. */
.topgrid{position:sticky;top:0;z-index:55;display:grid;gap:13px;align-items:start;
  grid-template-columns:var(--tpl);padding:14px 0 12px;margin-bottom:2px;
  background:linear-gradient(var(--paper-bg) 80%,rgba(252,252,250,0))}
.topgrid .sbar{grid-column:var(--barcol,2)}
.wrap{display:grid;gap:13px;align-items:start;grid-template-columns:var(--tpl)}
.slot{min-width:0;display:flex;flex-direction:column;gap:13px}

/* ── Cards ── */
.lcard{position:relative;background:var(--p-surface);border-radius:var(--r-xl);box-shadow:var(--card-lift);min-width:0}
.lcard.flat{background:transparent;box-shadow:none;border-radius:0}
.chead{display:flex;align-items:baseline;gap:8px;padding:11px 14px 9px;border-bottom:1px solid var(--divider)}
.lcard.flat .chead{padding-left:2px;padding-right:2px}
.ctitle{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .marg{margin:0 0 0 auto;flex-wrap:nowrap;overflow:hidden}
.cbody{padding:10px 14px 14px}
.lcard.flat .cbody{padding-left:2px;padding-right:2px}

/* The addressed card wears the navy rule. One card or four, it is in the
   same place and means the same thing: a bare command acts here. */
.lcard::before{content:"";position:absolute;left:-7px;top:10px;bottom:10px;width:2px;border-radius:1px;
  background:rgb(var(--navy));opacity:0;transition:opacity .14s}
.lcard.addr::before{opacity:1}
.fwin .lcard::before{left:-1px}

/* ── Library ── */
.lfilt{display:flex;flex-wrap:wrap;gap:0 10px;padding:2px 14px 8px;font:italic 400 11px var(--font-serif);color:var(--marg)}
.lfilt button{font:inherit;color:inherit;border:none;background:none;padding:2px 0;cursor:pointer}
.lfilt button:hover{color:var(--ink)}
.lfilt button.on{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.lscroll{max-height:calc(100vh - 210px);overflow:auto;padding:0 8px 10px}
.lgrp{font:600 9px var(--font-sans);letter-spacing:.055em;color:var(--ink);padding:12px 6px 6px;display:flex}
.lgrp .n{margin-left:auto;font:500 9px var(--font-mono);color:var(--p-ink-3);letter-spacing:0}
.li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:8px 6px;border-radius:var(--r-md);cursor:pointer}
.li:hover{background:var(--p-subtle)}
.li.sel{background:var(--ink-wash)}
.li.soon{cursor:default}
.li.soon .lname,.li.soon .ldesc,.li.soon .pv{opacity:.45}
.lname{display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:500;line-height:1.3}
.ldesc{font-size:11px;color:var(--p-ink-2);line-height:1.4;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .marg{margin-top:3px;font-size:10.5px;line-height:1.55}
.li:hover .marg{color:var(--p-gold-deep)}
/* Library kinds are ink, never the Almanac's hues: a catalogue entry must
   not be mistaken for a chat or a note. Pills are never interactive. */
.lpill{display:inline-flex;font:500 9.5px var(--font-sans);padding:1px 6px;border-radius:8px;
  border:.5px solid var(--ink-soft);color:var(--p-ink-2);white-space:nowrap;flex-shrink:0}
.lpill.soon{border-style:dashed;color:var(--p-ink-3)}
.lpill.mine{background:var(--ink-wash-2);border-color:transparent;color:var(--ink)}
.lcount{font:500 10px var(--font-mono);color:var(--p-ink-3)}
.lnone{padding:26px 10px;text-align:center;font:italic 400 11.5px var(--font-serif);color:var(--marg)}

/* previews: the existing Library's swatches and silhouettes, kept */
.pv{width:40px;height:30px;border-radius:5px;border:.5px solid var(--p-border);background:var(--p-subtle);
  position:relative;overflow:hidden;flex-shrink:0}
.pv.sw{border-color:rgba(25,25,25,.12)}
.pv.sw i{position:absolute;width:9px;height:9px;border-radius:50%;top:10px}
.pv.sw i:nth-child(1){left:9px}.pv.sw i:nth-child(2){left:21px}
.pv.pl b{position:absolute;background:rgba(25,25,25,.16);border-radius:1.5px}
.pv.ic{display:flex;align-items:center;justify-content:center;color:var(--p-ink-2)}
.pv.ic svg{width:15px;height:15px}
.pv.rm b{position:absolute;border-radius:1.5px}

/* popped: the grid, because there is room for it */
.fwin .lscroll{max-height:none;display:block}
.fwin .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;padding:0 6px}
.fwin .li{grid-template-columns:1fr;border:.5px solid var(--p-border-2);background:var(--p-surface);padding:8px}
.fwin .li.sel{background:var(--ink-wash);border-color:var(--ink-soft)}
.fwin .pv{width:100%;height:78px;border-radius:6px}
.fwin .pv.sw i{width:18px;height:18px;top:30px}
.fwin .pv.sw i:nth-child(1){left:calc(50% - 22px)}.fwin .pv.sw i:nth-child(2){left:calc(50% + 4px)}
.fwin .pv.ic svg{width:24px;height:24px}

/* ── Canvas ── */
.cvwrap{padding:16px;background:var(--p-subtle);border-radius:0 0 var(--r-xl) var(--r-xl);display:flex;justify-content:center}
.room{--rbg:#fff;--racc:#B8A070;--rdeep:#9C8760;--rink:#191919;--rline:rgba(25,25,25,.10);
  width:100%;max-width:860px;min-height:430px;background:var(--rbg);color:var(--rink);border-radius:12px;
  box-shadow:0 1px 3px rgba(40,36,28,.08),0 0 0 .5px rgba(25,25,25,.08);display:grid;gap:10px;padding:12px;
  transition:background .25s,color .25s,max-width .3s}
.room.mobile{max-width:340px;min-height:560px}
.rslot{border-radius:8px;display:flex;flex-direction:column;gap:7px;min-width:0;padding:6px;
  background:color-mix(in srgb,var(--rink) 3%,transparent)}
.rlab{font:500 9px var(--font-sans);letter-spacing:.03em;opacity:.45;padding:0 2px}
.comp{position:relative;border-radius:7px;padding:8px 9px;background:color-mix(in srgb,var(--rbg) 88%,var(--rink) 6%);
  border:.5px solid var(--rline);cursor:pointer;min-width:0}
.comp:hover{border-color:color-mix(in srgb,var(--rink) 30%,transparent)}
/* What a bare command acts on carries the navy rule, inside the room too.
   The room keeps its own scheme; the rule is the Lab's, not the room's. */
.comp.sel{box-shadow:inset 2px 0 0 rgb(var(--navy)),0 0 0 1px rgba(38,56,92,.35)}
.cname{font:600 10.5px var(--font-sans);display:flex;align-items:center;gap:6px}
.cname .dot{width:6px;height:6px;border-radius:50%;background:var(--racc)}
.sk{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.sk i{display:block;height:4px;border-radius:2px;background:color-mix(in srgb,var(--rink) 12%,transparent)}
.bub{font-size:10.5px;line-height:1.35;padding:5px 8px;border-radius:8px;max-width:82%;
  background:color-mix(in srgb,var(--rink) 6%,transparent)}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--racc) 22%,transparent)}
.bub.try{outline:1px dashed color-mix(in srgb,var(--rink) 30%,transparent)}
.msgs{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.inp{margin-top:5px;font-size:10.5px;padding:6px 8px;border-radius:7px;opacity:.7;
  border:.5px solid color-mix(in srgb,var(--rink) 22%,transparent)}
.chipr{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chipr span{font-size:9px;padding:1px 6px;border-radius:7px;background:color-mix(in srgb,var(--racc) 25%,transparent)}
.meter{margin-top:6px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--rink) 10%,transparent);overflow:hidden}
.meter b{display:block;height:100%;width:32%;background:var(--racc)}
.cap{border:1px dashed color-mix(in srgb,var(--rink) 18%,transparent);border-radius:7px;padding:7px 9px;
  font-size:9.5px;opacity:.55;text-align:center}
.sheetrow{display:flex;gap:6px;flex-wrap:wrap}
.sheetrow .comp{flex:1 1 90px}
.ghost .rslot{background:none;border:1px dashed rgba(25,25,25,.14)}
.ghostmsg{grid-column:1/-1;align-self:center;text-align:center;font:italic 400 12px var(--font-serif);color:var(--marg);line-height:1.7}
.ghostmsg code{font:500 11px var(--font-mono);color:var(--ink);font-style:normal}

/* ── The guide ── */
.guide{margin:0 0 12px;background:var(--p-surface);border-radius:12px;padding:14px 16px 12px;position:relative}
.gtop{display:flex;align-items:baseline;gap:10px}
.gstep{font:500 10px var(--font-mono);color:var(--p-ink-3)}
.gq{font-size:14px;font-weight:600;margin-top:3px}
.gwhy{font:italic 400 11px var(--font-serif);color:var(--marg);margin-top:3px;line-height:1.5}
.gopts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gopts button{position:relative;border:none;background:transparent;border-radius:var(--r-btn);padding:8px 12px;
  font:500 11.5px var(--font-sans);color:var(--p-ink-2);cursor:pointer;text-align:left}
.gopts button small{display:block;font:italic 400 10.5px var(--font-serif);color:var(--marg);margin-top:2px}
.gopts button:hover{color:var(--ink)}
.gopts button.on{background:var(--ink-wash);color:var(--ink)}
.gtrack{display:flex;gap:5px;margin-left:auto}
.gtrack i{width:6px;height:6px;border-radius:50%;border:1px solid var(--ink-soft)}
.gtrack i.done{background:var(--ink);border-color:var(--ink)}
.gtrack i.now{border-color:var(--ink)}
.gfoot{margin-top:10px;display:flex;gap:12px;font:italic 400 11px var(--font-serif);color:var(--marg)}
.gfoot button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
.gfoot button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}

/* ── Inspector ── */
.ihead{display:flex;align-items:center;gap:8px}
.iname{font-size:14px;font-weight:600}
.idesc{font-size:11.5px;line-height:1.55;color:var(--p-ink-2);margin-top:6px}
.irows{margin-top:10px;border-top:.5px solid var(--p-border-2)}
.irow{display:grid;grid-template-columns:98px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:.5px solid var(--p-border-2);align-items:baseline}
.irow .k{font-size:10.5px;color:var(--p-ink-3)}
.irow .v{font-size:11.5px;min-width:0}
.pick{font:italic 400 11.5px var(--font-serif);color:var(--p-ink);border:none;background:none;padding:0;cursor:pointer;display:inline-flex;align-items:baseline;gap:3px}
.pick .car{font-style:normal;font-size:8px;opacity:0;transition:opacity .12s}
.lcard:hover .pick .car{opacity:.6}
.pick:hover{text-decoration:underline;text-underline-offset:2px}
.ilist{margin-top:4px}
.ilist button{display:flex;width:100%;gap:8px;align-items:baseline;border:none;background:none;padding:4px 0;cursor:pointer;text-align:left;font-size:11.5px;color:var(--p-ink)}
.ilist button span{margin-left:auto;font:italic 400 10.5px var(--font-serif);color:var(--marg)}
.ilist button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.isec{font:600 9px var(--font-sans);letter-spacing:.055em;color:var(--ink);margin:14px 0 4px}
.ifoot{margin-top:12px;font:italic 400 10.5px var(--font-serif);color:var(--marg);line-height:1.5}

/* ── Collection (the Almanac's card, sourced) ── */
.coll .wshead{padding:10px 2px}
.coll .wsbody{background:transparent;padding:10px 0;max-height:none}
.ci{display:grid;grid-template-columns:18px 30px minmax(0,1fr);gap:8px;padding:8px 8px;margin-bottom:6px;
  background:var(--p-surface);border:.5px solid var(--p-border);border-radius:var(--r-md);box-shadow:var(--card-lift)}
.ci .num{font:500 10px var(--font-mono);color:var(--p-ink-3);padding-top:2px;text-align:right}
.ci .pv{width:30px;height:24px}
.ci .nm{font-size:12px;font-weight:500;display:flex;gap:6px;align-items:baseline}
.ci .nt{font:italic 400 11.5px var(--font-serif);color:var(--p-ink);margin-top:4px;padding-left:8px;border-left:2px solid var(--ink-soft);line-height:1.45}
.ci .marg{margin-top:3px;font-size:10.5px}
.ci:hover .marg{color:var(--p-gold-deep)}
.csec{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px;padding:0 2px 4px;border-bottom:.5px solid var(--ink-soft)}
.csec b{font:600 9px var(--font-sans);letter-spacing:.055em;color:var(--ink)}
.csec span{font:italic 400 10.5px var(--font-serif);color:var(--marg)}
.cmpt{width:100%;border-collapse:collapse;font-size:11px;margin:4px 0 10px;background:var(--p-surface);border-radius:var(--r-md);overflow:hidden}
.cmpt th,.cmpt td{padding:6px 8px;text-align:left;border-bottom:.5px solid var(--p-border-2);vertical-align:top}
.cmpt th{font:600 10.5px var(--font-sans)}
.cmpt td.k{font-size:10.5px;color:var(--p-ink-3);width:64px}
/* difference in ink, never colour: a pale wash on what differs */
.cmpt td.diff{background:var(--ink-wash)}
.reply{background:var(--p-surface);border-radius:var(--r-md);padding:10px 12px;margin:6px 0 10px;font-size:11.5px;line-height:1.55}
.reply .q{font:italic 400 11px var(--font-serif);color:var(--marg);margin-bottom:5px}
.reply .marg{margin-top:6px;font-size:10.5px}
.wsacts{padding:6px 0 4px}
.scopeline{font-size:10px;color:var(--p-ink-3)}
.scopeline b{color:var(--ink);font-weight:600}
.cnote{font:italic 400 11.5px var(--font-serif);color:var(--p-ink);margin:0 0 10px;padding-left:8px;border-left:2px solid var(--ink)}
.btnrow button{position:relative}

/* ── Popped windows (drawn in page; real windows in the product) ── */
.fwin{position:fixed;z-index:65;background:var(--paper-bg);border-radius:10px;
  box-shadow:0 18px 50px rgba(40,36,28,.18),0 0 0 .5px rgba(25,25,25,.12);display:flex;flex-direction:column;
  min-width:320px;max-height:86vh}
.fbar{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:move;border-bottom:.5px solid var(--p-border);
  font:500 10.5px var(--font-sans);color:var(--p-ink-3);user-select:none}
.fbar .dots{display:flex;gap:4px}.fbar .dots i{width:8px;height:8px;border-radius:50%;background:var(--p-border)}
.fbar .marg{margin:0 0 0 auto}
.fin{overflow:auto;padding:12px}
.fin .lcard{box-shadow:none}
.popph{padding:18px 16px;text-align:center;font-size:11.5px;color:var(--p-ink-2);line-height:1.6;border-radius:var(--r-xl)}
.popph .marg{justify-content:center;margin-top:4px}

/* ── Try row ── */
.trybar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:9px 18px;background:var(--paper-bg);
  border-top:.5px solid var(--p-border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--p-ink-2)}
.trybar b{font:italic 400 11px var(--font-serif);color:var(--marg);font-weight:400}
.trybar button{border:.5px solid var(--p-border);background:var(--p-surface);border-radius:12px;padding:3px 10px;
  font:400 11px var(--font-sans);color:var(--p-ink-2);cursor:pointer}
.trybar button:hover{color:var(--ink);border-color:var(--ink-soft)}


/* ═══ v2 ═══ */
/* The room's own settings sit in its head; the selected block's in its foot. */
.chead .ctitle .pick{font:600 12.5px var(--font-sans);font-style:normal;color:var(--p-ink)}
.chead .marg.rh{gap:0 6px}
.chead .marg.rh .pick{font-size:11px;color:inherit}
.cfoot2{padding:8px 14px 10px;border-top:1px solid var(--divider);min-height:38px}
.cfoot2 .marg{margin:0}
.cfoot2.on .marg{color:var(--p-ink-2)}
.cfoot2 b{font:600 11.5px var(--font-sans);font-style:normal;color:var(--ink)}
.cfoot2 .pick{font-size:11px}
/* Features live inside their block: toggles, never blocks. */
.feats{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ft{font:500 9px var(--font-sans);padding:2px 7px;border-radius:8px;cursor:pointer;color:inherit;opacity:.6;
  background:transparent;border:.5px dashed color-mix(in srgb,var(--rink) 35%,transparent)}
.ft.on{opacity:1;border-style:solid;background:color-mix(in srgb,var(--racc) 22%,transparent);border-color:transparent}
.lfeat{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.lfeat span{font:500 9.5px var(--font-sans);padding:1px 6px;border-radius:8px;border:.5px dashed var(--ink-soft);color:var(--p-ink-2)}
.lfeat span.hit{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--ink-wash)}
/* inspect: the Almanac's peek, under the field, one thing in detail */
.insp{display:none;position:absolute;left:0;right:0;top:66px;z-index:61;background:var(--p-surface);border-radius:var(--r-btn);
  padding:16px 20px 14px;box-shadow:0 8px 28px rgba(40,36,28,.08);max-height:64vh;overflow:auto}
.insp.open{display:block}
.insp .irows{max-width:620px}
/* Where a block fits. Navy: it previews what the command addresses. */
.room .rslot{transition:background .14s,box-shadow .14s,opacity .14s}
.room .rslot.g1{background:rgba(38,56,92,.12);box-shadow:inset 0 0 0 1.5px rgba(38,56,92,.75)}
.room .rslot.g2{background:rgba(38,56,92,.05);box-shadow:inset 0 0 0 1px rgba(38,56,92,.32)}
.room .rslot.g0{opacity:.42}
.room.dk .rslot.g1{background:rgba(200,215,240,.14);box-shadow:inset 0 0 0 1.5px rgba(200,215,240,.8)}
.room.dk .rslot.g2{background:rgba(200,215,240,.06);box-shadow:inset 0 0 0 1px rgba(200,215,240,.35)}
.why{font:italic 400 10px var(--font-serif);text-align:center;opacity:.9}
.why:empty{display:none}


/* ═══ v3: the Canvas drawn the Almanac's way ═══
   The old canvas carried the previous design: a grey well, raised boxes,
   filled slots, bars and bubbles, coloured dots. The Almanac draws with
   rules and type instead: a dotted outline, hairline dividers, small
   letter-spaced labels, one line of italic marginalia per row, washes only
   for selection. The room keeps its own theme inside its edges; the drawing
   language around and through it is the Almanac's. */
.rline{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;min-height:48px;padding:8px 14px;border-bottom:1px solid var(--divider)}
.rl-t{font-size:15px;font-weight:600;line-height:1.3;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.rl-t .crumb{font:inherit;color:var(--p-ink-3);border:none;background:none;padding:0;cursor:pointer}
.rl-t .crumb:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.rl-t .sl{color:var(--p-ink-3);font-weight:400}
.rline .marg{margin:0}
.rline .pick{font-size:11px;color:inherit}
body.cv-lines .cvwrap{padding:18px 18px 20px;background:transparent;display:block;border-radius:0}
body.cv-lines .cvroom{display:flex;justify-content:center}

body.cv-lines .room{box-shadow:none;border-radius:10px;padding:0;gap:0;min-height:400px;background:var(--rbg);overflow:hidden}
body.cv-lines .room .rslot{background:transparent;border-radius:0;padding:10px 12px 12px;gap:0;border:none;
  --edge:1px 0 0 var(--rline),0 1px 0 var(--rline);box-shadow:var(--edge)}
body.cv-lines .rlab{font:600 9px var(--font-sans);letter-spacing:.055em;opacity:.62;padding:0 0 7px}
body.cv-lines .comp{background:transparent;border:none;border-radius:0;padding:8px 8px 8px 9px;border-top:.5px solid var(--rline);margin:0 -4px}
body.cv-lines .comp:hover{border-color:var(--rline);background:color-mix(in srgb,var(--rink) 3%,transparent)}
body.cv-lines .comp.sel{background:color-mix(in srgb,var(--rink) 5.5%,transparent);box-shadow:inset 2px 0 0 rgb(var(--navy))}
body.cv-lines .room.dk .comp.sel{box-shadow:inset 2px 0 0 rgba(200,215,240,.85)}
body.cv-lines .cname{font:500 11.5px var(--font-sans);display:block}
body.cv-lines .cst{font:italic 400 10.5px var(--font-serif);opacity:.6;margin-top:2px;line-height:1.45}
body.cv-lines .tx{margin-top:6px;display:flex;flex-direction:column;gap:5px}
body.cv-lines .txr{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:11.5px;line-height:1.45}
body.cv-lines .txr .who{font:500 9.5px var(--font-mono);opacity:.5;padding-top:2px}
body.cv-lines .txr.try{opacity:.7}
body.cv-lines .inp{margin-top:7px;font-size:11px;padding:7px 9px;opacity:1;border:none;color:color-mix(in srgb,var(--rink) 45%,transparent)}
body.cv-lines .inp svg.bx path{stroke:color-mix(in srgb,var(--rink) 30%,transparent) !important}
body.cv-lines .feats{margin-top:7px}
body.cv-lines .ft{font:500 9.5px var(--font-sans);padding:2px 8px;border-radius:10px;opacity:1;color:color-mix(in srgb,var(--rink) 60%,transparent);
  background:transparent;border:.5px dashed color-mix(in srgb,var(--rink) 32%,transparent)}
body.cv-lines .ft.on{color:var(--rink);background:color-mix(in srgb,var(--rink) 6%,transparent);border:.5px solid color-mix(in srgb,var(--rink) 55%,transparent)}
body.cv-lines .cap{border:none;padding:8px 0 0;font:italic 400 10.5px var(--font-serif);opacity:.5;text-align:left}
body.cv-lines .why{text-align:left;padding-top:4px}
body.cv-lines .ghost .rslot{--rline:rgba(25,25,25,.10)}
body.cv-lines .room .rslot.g1{background:rgba(38,56,92,.08);box-shadow:inset 2px 0 0 rgb(var(--navy)),var(--edge)}
body.cv-lines .room .rslot.g2{background:rgba(38,56,92,.035);box-shadow:inset 1px 0 0 rgba(38,56,92,.45),var(--edge)}
body.cv-lines .room.dk .rslot.g1{background:rgba(200,215,240,.10);box-shadow:inset 2px 0 0 rgba(200,215,240,.85),var(--edge)}
body.cv-lines .room.dk .rslot.g2{background:rgba(200,215,240,.05);box-shadow:inset 1px 0 0 rgba(200,215,240,.4),var(--edge)}
body.cv-lines .guide{margin-bottom:16px}


/* ═══ v4: the medium canvas (default) ═══
   The earlier canvas's depth, the Almanac's type. Kept from before: the
   well the room sits in, the room lifted off it, soft slot areas, raised
   blocks, the theme's accent dot, message bubbles, capacity as a dashed
   space. Taken from the Almanac: letter-spaced slot labels, a block's state
   as one line of italic marginalia instead of placeholder bars, features as
   tags, the navy rule for selection. */
body.cv-mid .cvwrap,body.cv-early .cvwrap{display:block;padding:16px 16px 18px;background:var(--p-subtle);border-radius:0 0 var(--r-xl) var(--r-xl)}
body.cv-mid .cvroom,body.cv-early .cvroom{display:flex;justify-content:center}
body:not(.cv-lines) .room>svg.bx,body:not(.cv-lines) .inp>svg.bx{display:none}
body.cv-mid .room{padding:10px;gap:8px;border-radius:12px;box-shadow:0 1px 3px rgba(40,36,28,.07),0 0 0 .5px rgba(25,25,25,.07)}
body.cv-mid .rslot{background:color-mix(in srgb,var(--rink) 2.5%,transparent);border-radius:8px;padding:8px 8px 9px;gap:6px}
body.cv-mid .rlab,body.cv-lines .rlab{font:600 9px var(--font-sans);letter-spacing:.055em;opacity:.6;padding:0 2px 2px}
body.cv-mid .comp{padding:8px 10px 9px;border-radius:7px;background:color-mix(in srgb,var(--rbg) 90%,var(--rink) 4%);border:.5px solid var(--rline)}
body.cv-mid .comp.sel{box-shadow:inset 2px 0 0 rgb(var(--navy)),0 0 0 1px rgba(38,56,92,.28)}
body.cv-mid .cname{font:500 11.5px var(--font-sans)}
body.cv-mid .cname .dot{width:5px;height:5px}
body.cv-mid .cst{font:italic 400 10.5px var(--font-serif);opacity:.62;margin-top:3px;line-height:1.45}
body.cv-mid .bub{font-size:11px;background:color-mix(in srgb,var(--rink) 5%,transparent)}
body.cv-mid .bub.me{background:color-mix(in srgb,var(--racc) 18%,transparent)}
body.cv-mid .inp{border:.5px solid color-mix(in srgb,var(--rink) 20%,transparent);opacity:.75;margin-top:6px}
body.cv-mid .ft{font:500 9.5px var(--font-sans);padding:2px 8px;border-radius:10px;opacity:1;color:color-mix(in srgb,var(--rink) 60%,transparent);
  background:transparent;border:.5px dashed color-mix(in srgb,var(--rink) 32%,transparent)}
body.cv-mid .ft.on{color:var(--rink);background:color-mix(in srgb,var(--racc) 20%,transparent);border:.5px solid transparent}
body.cv-mid .cap{border:1px dashed color-mix(in srgb,var(--rink) 14%,transparent);font:italic 400 10.5px var(--font-serif);opacity:.55;padding:6px 9px;text-align:center}
body.cv-mid .why{font:italic 400 10px var(--font-serif);text-align:center}
body.cv-mid .room .rslot.g1{background:rgba(38,56,92,.10);box-shadow:inset 0 0 0 1.5px rgba(38,56,92,.7)}
body.cv-mid .room .rslot.g2{background:rgba(38,56,92,.045);box-shadow:inset 0 0 0 1px rgba(38,56,92,.28)}
body.cv-mid .room.dk .rslot.g1{background:rgba(200,215,240,.13);box-shadow:inset 0 0 0 1.5px rgba(200,215,240,.8)}
body.cv-mid .room.dk .rslot.g2{background:rgba(200,215,240,.06);box-shadow:inset 0 0 0 1px rgba(200,215,240,.35)}
/* what each style shows */
body.cv-early .cst{display:none}
body.cv-mid .sk,body.cv-lines .sk{display:none}
body.cv-lines .msgs{display:none}
body.cv-early .tx,body.cv-mid .tx{display:none}
body.cv-lines .cname .dot{display:none}
body.cv-early .ldet,body.cv-early .rline{}
.cvsw{display:inline-flex;gap:2px;margin-left:8px;padding-left:10px;border-left:.5px solid var(--p-border)}
.cvsw button.on{color:var(--ink);border-color:var(--ink)}
/* ═══ v3: the Library's details section ═══ */
.ldet{position:relative;padding:12px 14px 12px;border-bottom:1px solid var(--divider)}
.ldet.none{padding:9px 14px;font:italic 400 11px var(--font-serif);color:var(--marg)}
.ldet .iname{font-size:14px}
.ldet .irows{margin-top:8px}
.ldet .irow{grid-template-columns:78px minmax(0,1fr)}
.ldet .marg{margin-top:8px}
.xclose{position:absolute;right:10px;top:9px;width:20px;height:20px;border:none;background:none;color:var(--p-ink-3);
  font-size:15px;line-height:1;cursor:pointer;border-radius:4px}
.xclose:hover{color:var(--ink);background:var(--ink-wash)}
.fwin .ldet{max-width:720px}
.fbar button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
.fbar button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
#poprow button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
#poprow button:hover{color:var(--ink)}


/* ═══ v6 ═══ */
/* Library rows: checkbox, preview, text. Details open under the row. */
.li{grid-template-columns:16px 40px minmax(0,1fr);gap:9px;align-items:start}
.li .cb,.li .cbsp{margin-top:7px}
.cb{width:16px;height:16px;border:1px solid var(--ink-soft);border-radius:3px;background:var(--p-surface);color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.cb:hover{border-color:var(--ink)}
.cb.on{border-color:var(--ink)}
.cb svg{width:11px;height:11px;opacity:0}
.cb.on svg{opacity:1}
.cb.dis{opacity:.3;cursor:default}
.cbsp{width:16px;height:16px;display:block}
.linl{grid-column:1/-1;margin:6px 0 2px 25px;padding:10px 12px;background:var(--p-surface);border:.5px solid var(--p-border);
  border-radius:var(--r-md);position:relative;cursor:default}
.linl .iname{font-size:13px}
.linl .irow{grid-template-columns:74px minmax(0,1fr)}
.li.sel{background:var(--ink-wash)}
.lsel{padding:0 14px 8px;min-height:24px}
.lsel .marg{margin:0}
.lsel.on .marg{color:var(--p-ink-2)}
.lsel b{font:600 11px var(--font-sans);font-style:normal;color:var(--ink)}
/* popped: grid, and details in a side column */
.fwin .li{grid-template-columns:1fr;position:relative}
.fwin .li .cb,.fwin .li .cbsp{position:absolute;left:14px;top:14px;margin:0;z-index:1}
.lsplit{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.lside{position:sticky;top:0;padding:12px 14px;background:var(--p-surface);border:.5px solid var(--p-border);border-radius:var(--r-md);margin-right:6px}
.lside .irow{grid-template-columns:74px minmax(0,1fr)}
/* the room line: pickers left, actions at the right end */
.rline{flex-wrap:nowrap}
.rline>.marg{flex:1 1 auto;min-width:0}
.rl-act{margin-left:auto;flex-shrink:0}
.rl-act .marg{margin:0}
.mhead{font:600 9px var(--font-sans);letter-spacing:.055em;color:var(--p-ink-3);padding:6px 8px 4px}

@media (max-width:1100px){
  .wrap,.topgrid{grid-template-columns:1fr !important}
  .topgrid .sbar{grid-column:1 !important}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

var NS='http://www.w3.org/2000/svg';

function rrPath(w,h,r){
  var i=0.5, rad=r-i, m=r-rad*0.7071;
  return 'M'+m+','+m+
    'A'+rad+','+rad+' 0 0 1 '+r+','+i+' H'+(w-r)+
    'A'+rad+','+rad+' 0 0 1 '+(w-i)+','+r+' V'+(h-r)+
    'A'+rad+','+rad+' 0 0 1 '+(w-r)+','+(h-i)+' H'+r+
    'A'+rad+','+rad+' 0 0 1 '+i+','+(h-r)+' V'+r+
    'A'+rad+','+rad+' 0 0 1 '+m+','+m;
}

function paintBorder(el){
  var kind=el.getAttribute('data-border'), r=+(el.getAttribute('data-radius')||8);
  var w=el.offsetWidth, h=el.offsetHeight;
  if(w<2*r+2||h<2*r+2) return;

  var svg=el.querySelector(':scope > svg.bx');
  if(!svg){
    svg=document.createElementNS(NS,'svg');
    svg.setAttribute('class','bx'); svg.setAttribute('aria-hidden','true');
    el.appendChild(svg);
  }
  svg.innerHTML='';
  svg.setAttribute('width',w); svg.setAttribute('height',h);
  svg.setAttribute('viewBox','0 0 '+w+' '+h);

  var d=rrPath(w,h,r);
  function mkPath(cls){
    var q=document.createElementNS(NS,'path');
    q.setAttribute('d',d); q.setAttribute('fill','none');
    q.setAttribute('stroke-width','1'); q.setAttribute('stroke-linecap','round');
    if(cls) q.setAttribute('class',cls);
    svg.appendChild(q); return q;
  }

  if(kind==='prog'){
    /* Two paths. The ink one is the resting progressive dash: mirrored halves
       growing from a dot at the top-left to a solid bottom-right corner, so it
       reads like light falling from the top-left. The gold one is solid and
       hidden by its own length, and draws itself in when the element is live. */
    var ink=mkPath('prog-ink');
    var L=ink.getTotalLength();
    ink.style.stroke='var(--ink-prog)';
    var gEnd=3.5, gJoin=1, maxDash=12;
    var half=(L-gEnd-gJoin)/2, A=[], S=0;
    while(true){
      var t=Math.min(S/half,1);
      var dash=0.01+maxDash*Math.pow(t,1.4);
      var gap=3.5-2.6*t;
      if(A.length && S+gap+dash>half) break;
      if(A.length){A.push(gap);S+=gap;}
      A.push(dash); S+=dash;
    }
    A[A.length-1]+=half-S;
    ink.setAttribute('stroke-dasharray',A.concat([gJoin],A.slice().reverse(),[gEnd]).join(' '));

  }else{
    /* Even dots, spacing nudged so a whole number fits the perimeter exactly. */
    var dots=mkPath('');
    var L2=dots.getTotalLength();
    dots.style.stroke='var(--ink-dot)';
    var count=Math.max(4,Math.round(L2/4)), seg=L2/count;
    dots.setAttribute('stroke-dasharray','0.01 '+(seg-0.01));
  }
}

var RO=window.ResizeObserver?new ResizeObserver(function(es){es.forEach(function(e){paintBorder(e.target);});}):null;

function find(name,kinds){

  var hit=all.filter(function(x){return norm(x.name)===n||norm(x.name).replace(/ /g,'')===n.replace(/ /g,'');});
  if(!hit.length) hit=all.filter(function(x){return norm(x.name).indexOf(n)===0;});

/* ═══ Where a block fits ═══
   The old Lab lit up the slots while a block was dragged. Without drag, the
   same light comes on when you hover a block in the Library, hover its
   place marginalia, or type place: with a block named. The best free slot
   shows strongest, other slots it fits more gently; a full slot, or one it
   is not built for, dims and says why. A slot word narrows it to that slot.
   Navy, not gold: it previews what the command will address. */
var HOVERGLOW=null;
function glowFor(cid,only){
  var r=R(); if(!r.plan) return null;
  var c=compBy(cid), ps=planSlots(), here=inRoom(cid), out={}, best=null;
  Object.keys(ps).forEach(function(s){
    var n=slotCount(s)-(here&&here.slot===s?1:0), full=n>=ps[s], fits=c.fits.indexOf(s)>-1;
    if(only&&s!==only){out[s]={k:'off'};return;}
    if(here&&here.slot===s) out[s]={k:'off',why:'it is here now'};
    else if(!fits&&!only) out[s]={k:'no',why:'not built for it'};
    else if(full) out[s]={k:'no',why:'full'};
    else if(!fits) out[s]={k:'two',why:'not built for it'};
    else {out[s]={k:'two'}; if(!best) best=s;}
  });
  c.fits.forEach(function(s){if(out[s]&&out[s].k==='two'&&!best) best=s;});
  var first=null; for(var i=0;i<c.fits.length;i++){if(out[c.fits[i]]&&out[c.fits[i]].k==='two'){first=c.fits[i];break;}}
  if(only&&out[only]&&out[only].k==='two') first=only;
  if(first) out[first].k='one';
  return out;
}
function applyGlow(){
  var g=null, v=document.getElementById('q').value, p=/^>/.test(v)?parse(v):null;
  if(p&&p.colon&&p.s==='place'){var sp=splitSlot(p.a), nm=names(sp.rest)[0], it=nm&&find(nm,['comp']); if(it) g=glowFor(it.cid,sp.slot);}
  if(!g&&HOVERGLOW) g=glowFor(HOVERGLOW,null);
  document.querySelectorAll('.room .rslot[data-slot]').forEach(function(el){
    var s=el.getAttribute('data-slot'), st=g&&g[s];
    el.classList.remove('g1','g2','g0'); var w=el.querySelector('.why'); if(w) w.textContent='';
    if(!st) return;
    if(st.k==='one') el.classList.add('g1'); else if(st.k==='two') el.classList.add('g2'); else if(st.k==='no'){el.classList.add('g0'); if(w) w.textContent=st.why;}
  });
}

/* ═══════════════════════════════════════════════════════════════════
   THE VERBS
   Same shape as the Almanac and the docket: pre() says what Enter will do
   before you press it, run() does it. Nothing runs without an Enter line.
   ═══════════════════════════════════════════════════════════════════ */
function unq(t){var m=String(t||'').match(/"([^"]*)"|“([^”]*)”/);return m?(m[1]!=null?m[1]:m[2]):String(t||'').trim();}
function names(a){return String(a||'').split(',').map(function(x){return x.replace(/["“”]/g,'').trim();}).filter(Boolean);}
function splitSlot(a){
  var w=String(a||'').trim().split(/\s+/);
  for(var n=2;n>=1;n--){ if(w.length>n){ var tail=w.slice(-n).join(' '), s=slotWord(tail); if(s) return {rest:w.slice(0,-n).join(' '),slot:s}; } }
  return {rest:String(a||'').trim(),slot:null};
}
var ANY=null;
function heldSection(){
  var i=S.coll.items.findIndex(function(e){return e.t==='s'&&e.name==='Held from the room';});
  if(i<0){S.coll.items.push({t:'s',name:'Held from the room'});i=S.coll.items.length-1;}
  return i;
}
function addToColl(key,held){
  if(collHas(key)) return;
  if(held){var i=heldSection();S.coll.items.splice(S.coll.items.length,0,{t:'i',key:key});}
  else{ var hi=S.coll.items.findIndex(function(e){return e.t==='s'&&e.name==='Held from the room';});
    if(hi>-1) S.coll.items.splice(hi,0,{t:'i',key:key}); else S.coll.items.push({t:'i',key:key}); }
}
function dropFromColl(key){S.coll.items=S.coll.items.filter(function(e){return !(e.t==='i'&&e.key===key);});
  var last=S.coll.items[S.coll.items.length-1]; if(last&&last.t==='s'&&last.name==='Held from the room') S.coll.items.pop();}

/* plan migration, used by plan: and apply: */
function migrate(pid){
  var P=PLANS[pid], taken={}, moves=[], held=[], keep=[], r=R();
  function room(s){return (P.slots[s]||0)-(taken[s]||0);}
  r.comps.forEach(function(p){
    var c=compBy(p.c), to=null;
    if(room(p.slot)>0) to=p.slot; else for(var i=0;i<c.fits.length;i++){if(room(c.fits[i])>0){to=c.fits[i];break;}}
    if(to){taken[to]=(taken[to]||0)+1;keep.push({c:p.c,slot:to});if(to!==p.slot) moves.push(c.name+' moves from the '+SLOTNAME[p.slot]+' to the '+SLOTNAME[to]);}
    else held.push(p.c);
  });
  var adds=[];
  if(!r.plan){ var base=[['messages','main'],['input','input']]; if(pid==='doc') base.unshift(['doccanvas','main']); if(pid==='canvas') base=[['table','main'],['input','input']];
    base.forEach(function(b){if(room(b[1])>0){taken[b[1]]=(taken[b[1]]||0)+1;keep.push({c:b[0],slot:b[1]});adds.push(compBy(b[0]).name);}}); }
  return {keep:keep,moves:moves,held:held,adds:adds};
}

function addToCollection(its){
  its=its.filter(function(x){return !collHas(x.key);}); if(!its.length) return {bad:'already in the collection'};
  var start=!collKeys().length;
  return {ok:'Enter '+(start?'starts a collection from the Library with ':'adds ')+list(its.map(function(x){return x.name;}))+(start?'':' to the collection'),run:function(){
    its.forEach(function(x){addToColl(x.key);});S.hidden.collection=false;}};
}

   if(!n) return {ok:'type the room\u2019s new name inside the quotes'};
   if(S.rooms.some(function(r,i){return i!==S.cur&&norm(r.name)===norm(n);})) return {bad:'you already have a room called '+n};
   if(norm(n)===norm(R().name)) return {bad:'it is already called '+n};
   return {ok:'Enter names the room '+n+(R().name!=='Untitled room'?', instead of '+R().name:''),run:function(){R().name=n;}};}},
 {s:'compare',eg:'compare:',g:'side by side, differences washed',grp:'Collection',pre:function(a){
   if(norm(a)==='off') return {ok:'Enter closes the comparison',run:function(){S.cmp=false;}};
   var ns=names(a), add=[]; for(var i=0;i<ns.length;i++){var it=find(ns[i]); if(!it) return {bad:'nothing called '+ns[i]}; if(!collHas(it.key)) add.push(it);}
   if(collKeys().length+add.length<2) return {bad:'compare needs two things in the collection'};
   return {ok:'Enter compares '+Math.min(4,collKeys().length+add.length)+' things side by side'+(add.length?', collecting '+list(add.map(function(x){return x.name;}))+' first':'')+'; facts only, no tokens',
     run:function(){add.forEach(function(x){addToColl(x.key);});S.cmp=true;S.addr='collection';S.hidden.collection=false;}};}},
 {s:'apply',eg:'apply:',g:'put the collection into the room',grp:'Collection',pre:function(){
   var its=collKeys().map(byKey).filter(Boolean); if(!its.length) return {bad:'the collection is empty'};
   var plan=its.filter(function(x){return x.k==='plan'&&!x.soon;})[0], sch=its.filter(function(x){return x.k==='scheme';})[0];
   var comps=its.filter(function(x){return x.k==='comp'&&!inRoom(x.cid);}), bits=[], ops=[], load={};
   if(!R().plan&&!plan) return {bad:'the room needs a layout first; collect one, or layout:"Three-panel"'};
   var ps=plan?PLANS[plan.pid].slots:planSlots();
   if(plan&&plan.pid!==R().plan) bits.push('uses '+plan.name);
   if(sch&&sch.sid!==R().scheme) bits.push('paints it '+sch.name);
   var left=[];
   comps.forEach(function(x){var c=compBy(x.cid),to=null;
     for(var j=0;j<c.fits.length;j++){var s=c.fits[j]; var cur=R().comps.filter(function(p){return p.slot===s;}).length; if(ps[s]&&cur+(load[s]||0)<ps[s]){to=s;break;}}
     if(to){load[to]=(load[to]||0)+1;ops.push({c:c.id,slot:to});bits.push('places '+c.name+' in the '+SLOTNAME[to]);} else left.push(c.name);});
   if(!ops.length&&!(plan&&plan.pid!==R().plan)&&!(sch&&sch.sid!==R().scheme)) return {bad:left.length?'nothing collected can go in: '+list(left)+' '+(left.length>1?'have':'has')+' nowhere free in this plan':'everything collected is already in the room'};
   if(left.length) bits.push('leaves '+list(left)+' collected, with nowhere free');
   if(its.some(function(x){return x.k==='room';})) bits.push('rooms are duplicated, not applied, so they stay');
   if(!bits.length) return {bad:'everything collected is already in the room'};
   return {ok:'Enter '+bits.join('; '),run:function(){
     if(plan&&plan.pid!==R().plan){var m=migrate(plan.pid);R().plan=plan.pid;R().comps=m.keep;}
     if(sch) R().scheme=sch.sid;
     ops.forEach(function(o){R().comps.push(o);dropFromColl('comp:'+o.c);});}};}},
 {s:'pin',eg:'pin:"Rail candidates"',g:'a collection leads the rail',grp:'Collection',pre:function(){return notBuilt('Enter pins the collection so it leads the rail, here and in the Almanac');}},

 /* Layout: the same verbs as the Almanac */
 {s:'pop',eg:'pop:library, or pop:back library',g:'a card into its own window, or back',grp:'Layout',pre:function(a){
   var t=norm(a), back=/^back\b/.test(t); t=t.replace(/^back\s*/,'');
   if(back&&(!t||t==='all')) return Object.keys(S.pops).length?{ok:'Enter brings every window back',run:function(){S.pops={};}}:{bad:'nothing is in its own window'};
   var p=PANELS[t]; if(!p) return {bad:'pop which? library, room or collection'};
   if(back) return S.pops[p]?{ok:'Enter brings the '+p+' back',run:function(){delete S.pops[p];}}:{bad:'the '+p+' is not in its own window'};
   if(S.pops[p]) return {bad:'the '+p+' is already in its own window'};
   return {ok:'Enter puts the '+p+' in its own window'+(p==='library'?', where it shows as a grid':''),run:function(){popOut(p);}};}},
 {s:'move',eg:'move:library right',g:'reorder the columns',grp:'Layout',pre:function(a){
   var w=norm(a).split(' '), p=PANELS[w[0]], d=w[1]; if(!p||['left','right'].indexOf(d)<0) return {bad:'move:library right, or move:room left'};
   var sl=p==='collection'?'side':p, o=S.order.slice(), i=o.indexOf(sl);
   o.splice(i,1); if(d==='left') o.unshift(sl); else o.push(sl);
   return {ok:'Enter moves the '+p+' to the '+d,run:function(){S.order=o;}};}},

 /* Everywhere */
 {s:'undo',eg:'undo:',g:'take back the last change',grp:'Help',pre:function(){
   return HIST.length?{ok:'Enter takes back: '+(LASTRUN||'the last change'),undo:1}:{bad:'nothing to undo'};}},
 {s:'tour',eg:'tour:, or tour:docket',g:'a walk through this page, or another',grp:'Help',pre:function(a){return notBuilt('Enter starts a tour of '+(norm(a)||'the Lab'));}},
 {s:'help',eg:'help',g:'every command, same as ?',grp:'Help',pre:function(){return {ok:'Enter opens every command',keep:1,run:function(){openRef();}};}}
];
function verb(s){return V.filter(function(v){return v.s===s;})[0];}

/* ═══════════════════════════════════════════════════════════════════
   THE FIELD
   ═══════════════════════════════════════════════════════════════════ */
var Q=function(){return document.getElementById('q');};
var CMDH=[], HPOS=-1;
function mode(v){v=v==null?Q().value:v; if(/^p>/i.test(v)) return 'prm'; if(/^>/.test(v)) return 'cmd'; return 'search';}
function parse(v){var m=v.replace(/^>\s*/,'').match(/^([a-z]+)(:?)(.*)$/i); if(!m) return null; return {s:m[1].toLowerCase(),colon:!!m[2],a:m[3]};}
function setQ(){
  var v=Q().value, md=mode(v), f=document.getElementById('sfield');
  f.classList.toggle('cmd',md==='cmd'); f.classList.toggle('prm',md==='prm');
  if(md==='search'){ if(S.q!==v){S.q=v; if(v&&S.lib.kind==='all'){} render(); return;} }
  else if(S.q){S.q='';render();return;}
  hint();
}
function targetName(){return S.addr==='collection'?'the collection':S.addr==='library'?'the Library':R().name;}
function hint(){
  var el=document.getElementById('shint'), v=Q().value, md=mode(v), h='';
  if(md==='search'){
    if(!v) h='<span class="it first"><span class="pre">search the Library</span></span><span class="sep">·</span><span class="it"><code>&gt;</code> changes the room</span><span class="sep">·</span><span class="it"><code>p&gt;</code> tries it</span><span class="sep">·</span><span class="it">⌘K or / from anywhere</span><span class="sep">·</span><span class="it"><button data-ref="1"><code>?</code> <span class="gl">every command</span></button></span>';
    else {var n=document.querySelectorAll('[data-card=library] .li').length;
      h='<span class="it"><span class="pre">'+(S.pops.library||!S.hidden.library?plural(n,'thing')+' in the Library '+(n===1?'matches':'match'):'the Library is hidden; show:library to see what matches')+'</span></span><span class="sep">·</span><span class="it">Escape clears</span>';}
  }else if(md==='prm'){
    var t=v.replace(/^p>\s*/i,'');
    if(S.addr==='collection'&&collKeys().length) h='<span class="pre">\u2192 the collection</span><span class="sep">·</span>'+(t?'Enter asks about the '+plural(collKeys().length,'thing')+' collected, and keeps the reply there':'ask something about what is collected');
    else if(!inRoom('messages')) h='<span class="pre">\u2192 '+esc(R().name)+'</span><span class="sep">·</span><span class="bad">this room has no Messages to answer in; place:messages first</span>';
    else h='<span class="pre">\u2192 '+esc(R().name)+'</span><span class="sep">·</span>'+(t?'Enter tries this in the room; it is kept as a chat tagged tried in the Lab, and spends tokens':'talk to the room to try it; what you say is kept as a chat');
  }else{
    var p=parse(v);
    if(!p||!p.colon){
      var pre=p?p.s:'', hits=V.filter(function(x){return x.s.indexOf(pre)===0;});
      if(!hits.length) h='<span class="bad">no verb called '+esc(pre)+'; ? lists them all</span>';
      else h=hits.slice(0,8).map(function(x,i){return '<span class="it'+(i===0?' first':'')+'"><button data-w="'+esc(x.s+':')+'"><code>'+x.s+':</code> <span class="gl">'+esc(x.g)+'</span></button></span>';}).join('<span class="sep">·</span>');
    }else{
      var vb=verb(p.s);
      if(!vb) h='<span class="bad">no verb called '+esc(p.s)+'; ? lists them all</span>';
      else {var r=vb.pre(p.a);
        h='<span class="pre">\u2192 '+esc(['pop','move','close','open','library','resources','arrange','alm','edit','lab'].indexOf(p.s)>-1?'the Lab':p.s==='inspect'?'the Library':['section','note','compare','apply','pin'].indexOf(p.s)>-1||(['rm','add','name'].indexOf(p.s)>-1&&S.addr==='collection')?'the collection':R().name)+'</span><span class="sep">·</span>'+
          (r.bad?'<span class="bad">'+esc(r.bad)+'</span>':esc(r.ok));}
    }
  }
  el.innerHTML=h;
  if(typeof applyGlow==='function') applyGlow();
  var g=document.querySelector('.guide'); if(g&&S.guide){ g.querySelectorAll('.gopts button').forEach(function(b){b.classList.toggle('on',norm('>'+b.getAttribute('data-w'))===norm(v));}); }
}
function write(cmd,lead){
  var q=Q(); q.value=(lead||'>')+cmd; q.focus();
  var i=q.value.indexOf('""'); var pos=i>-1?i+1:q.value.length; q.setSelectionRange(pos,pos);
  closeRef(); setQ();
}
function submit(){
  var v=Q().value, md=mode(v);
  if(md==='search'){ var first=document.querySelector('[data-card=library] .li:not(.soon)'); if(first){S.insp=first.getAttribute('data-sl');render();} return; }
  if(md==='prm'){
    var t=v.replace(/^p>\s*/i,'').trim(); if(!t) return;
    if(S.addr==='collection'&&collKeys().length){snap();S.reply={q:t,a:sampleAnswer(t)};}
    else { if(!inRoom('messages')) return; snap(); S.tries.push({me:t,ai:'A sample reply. In the product this is '+R().name+'\u2019s model answering, inside the room, in its scheme.'}); }
    Q().value=''; setQ(); render(); return;
  }
  var p=parse(v); if(!p||!p.colon) return; var vb=verb(p.s); if(!vb) return; var r=vb.pre(p.a); if(r.bad) return;
  CMDH.push(v); HPOS=-1;
  if(r.undo){ S=JSON.parse(HIST.pop()); LASTRUN=''; Q().value=''; setQ(); render(); toast('Taken back.'); return; }
  if(!r.run){return;}
  if(!r.keep) snap();
  r.run(); LASTRUN=v.replace(/^>\s*/,'');
  if(S.guide&&S.guide.step<GUIDE.length&&GUIDE[S.guide.step].verb===p.s) S.guide.step++;
  if(!r.keep){Q().value='';}
  setQ(); render();
}
function sampleAnswer(q){
  var its=collKeys().map(byKey).filter(Boolean), nm=its.map(function(x){return x.name;});
  function gist(x){return x.desc.split(/[.;]/)[0].replace(/^./,function(c){return c.toLowerCase();});}
  if(/used/.test(norm(q))) return list(its.map(function(x){return x.name+' is '+usedIn(x).replace('used in','in').replace('not in any','in none');}))+'. Those are facts read from your rooms; the model only puts them into a sentence.';
  if(/writing|suit/.test(norm(q))) return nm[0]+' suits long writing best, because it stays out of the way until you want it. '+(nm[1]?nm[1]+' earns its place on a second pass rather than a first.':'');
  var here=its.filter(function(x){return x.k==='comp'&&inRoom(x.cid);}).map(function(x){return x.name;});
  return 'They differ in what each one keeps: '+its.map(function(x){return x.name+', '+gist(x);}).join('; ')+'. '+(here.length?list(here)+(here.length>1?' are':' is')+' already in this room.':'');
}

/* ── the reference ── */
function openRef(){
  var el=document.getElementById('cref'), grps={};
  V.forEach(function(x){(grps[x.grp]=grps[x.grp]||[]).push(x);});
  el.innerHTML='<div class="rhead"><div class="rtop"><span class="rlab">Every command in the Lab</span></div></div><div class="cols">'+
    Object.keys(grps).map(function(g){return '<div class="grp"><h4>'+g+'</h4>'+grps[g].map(function(x){
      return '<button data-w="'+esc(x.eg.split(', or ')[0].replace(/^[a-z]+:/,function(m){return m;}))+'"><code>'+esc(x.eg)+'</code><span class="gl">'+esc(x.g)+'</span></button>';}).join('')+'</div>';}).join('')+
    '</div><div class="foot">Clicking one writes it into the field. Nothing runs until Enter, and the line under the field says what Enter will do.</div>';
  el.classList.add('open'); paintAll();
}
function closeRef(){document.getElementById('cref').classList.remove('open');}

/* ── windows ── */
function popOut(p){
  var n=Object.keys(S.pops).length, w=p==='library'?Math.min(900,window.innerWidth-80):p==='canvas'?Math.min(960,window.innerWidth-80):380;
  S.pops[p]={x:Math.max(20,window.innerWidth-w-40-n*30),y:90+n*30,w:w};
}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show');},2200);}

/* ── menus (pickers) ── */
function openMenu(btn){
  var opts=JSON.parse(btn.getAttribute('data-pick')), m=document.getElementById('menu'), r=btn.getBoundingClientRect();
  var head=btn.getAttribute('data-head');
  m.innerHTML=(head?'<div class="mhead">'+esc(head)+'</div>':'')+opts.map(function(o){return '<button data-w="'+esc(o[1])+'">'+esc(o[0])+'</button>';}).join('');
  m.style.left=r.left+'px'; m.style.top=(r.bottom+4)+'px'; m.classList.add('open');
}

/* ═══════════════════════════════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════════════════════════════ */
document.addEventListener('mousedown',function(e){
  var c=e.target.closest('[data-card]'); if(c&&S.addr!==c.getAttribute('data-card')){S.addr=c.getAttribute('data-card');
    document.querySelectorAll('.lcard').forEach(function(x){x.classList.toggle('addr',x.getAttribute('data-card')===S.addr);}); hint();}
  var d=e.target.closest('[data-drag]'); if(d&&!e.target.closest('button')){
    var name=d.getAttribute('data-drag'), p=S.pops[name], sx=e.clientX, sy=e.clientY, ox=p.x, oy=p.y, el=document.getElementById('win-'+name);
    function mv(ev){p.x=ox+ev.clientX-sx;p.y=Math.max(0,oy+ev.clientY-sy);el.style.left=p.x+'px';el.style.top=p.y+'px';}
    function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);e.preventDefault();}
});
document.addEventListener('click',function(e){
  var m=document.getElementById('menu'); if(!e.target.closest('#menu')&&!e.target.closest('[data-pick]')) m.classList.remove('open');
  var t;
  if((t=e.target.closest('[data-pick]'))){openMenu(t);return;}
  if((t=e.target.closest('[data-closeinsp]'))){S.insp=null;render();return;}
  if((t=e.target.closest('[data-pk]'))){var key=t.getAttribute('data-pk'),i=S.pick.indexOf(key);if(i>-1)S.pick.splice(i,1);else S.pick.push(key);S.addr='canvas';render();return;}
  if((t=e.target.closest('[data-clearpick]'))){S.pick=[];render();return;}
  /* Moving things around the screen is not an edit, so it happens on click:
     bringing a window back, opening a closed board. Edits to a room still
     go through the field. */
  if((t=e.target.closest('[data-do]'))){var dv=t.getAttribute('data-do').split(':');snap();
    if(dv[0]==='back') delete S.pops[dv[1]]; else {S.hidden[dv[1]]=false;} render();return;}
  if((t=e.target.closest('[data-w]'))){m.classList.remove('open');if(t.getAttribute('data-addr')){S.addr=t.getAttribute('data-addr');}write(t.getAttribute('data-w'));return;}
  if((t=e.target.closest('[data-ref]'))){openRef();return;}
  if((t=e.target.closest('[data-kind]'))){S.lib.kind=t.getAttribute('data-kind');render();return;}
  if((t=e.target.closest('[data-guide]'))){snap();if(t.getAttribute('data-guide')==='skip')S.guide.step++;else S.guide=null;render();return;}
  if((t=e.target.closest('[data-ask]'))){S.addr='collection';write('','p>');return;}
  if((t=e.target.closest('[data-p]'))){S.addr='collection';write(t.getAttribute('data-p'),'p>');return;}
  if((t=e.target.closest('[data-dropreply]'))){S.reply=null;render();return;}
  if((t=e.target.closest('[data-selroom]'))){S.sel={t:'room'};render();return;}
  if((t=e.target.closest('[data-cv]'))){var v=t.getAttribute('data-cv');document.body.classList.remove('cv-early','cv-mid','cv-lines');document.body.classList.add('cv-'+v);
    document.querySelectorAll('[data-cv]').forEach(function(x){x.classList.toggle('on',x===t);});paintAll();return;}
  if((t=e.target.closest('[data-try]'))){tryState(t.getAttribute('data-try'));return;}
  if((t=e.target.closest('[data-sc]'))){S.sel={t:'comp',cid:t.getAttribute('data-sc')};S.addr='canvas';render();return;}
  if((t=e.target.closest('[data-sl]'))){if(e.target.closest('.linl'))return;var ky=t.getAttribute('data-sl');S.insp=S.insp===ky?null:ky;render();return;}
  if(e.target.closest('.room')){S.sel={t:'room'};render();return;}
  if(!e.target.closest('#cref')&&!e.target.closest('.sbar')) closeRef();
});
document.addEventListener('mouseover',function(e){var g=e.target.closest('[data-glow]'); var v=g?g.getAttribute('data-glow'):null; if(v!==HOVERGLOW){HOVERGLOW=v;applyGlow();}});
Q().addEventListener('input',setQ);
Q().addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();submit();}
  else if(e.key==='Escape'){if(document.getElementById('cref').classList.contains('open')) closeRef(); else if(S.insp){S.insp=null;render();} else {Q().value='';setQ();}}
  else if(e.key==='ArrowUp'&&CMDH.length&&(!Q().value||HPOS>-1)){e.preventDefault();HPOS=HPOS<0?CMDH.length-1:Math.max(0,HPOS-1);Q().value=CMDH[HPOS];setQ();}
  else if(e.key==='ArrowDown'&&HPOS>-1){e.preventDefault();HPOS++;if(HPOS>=CMDH.length){HPOS=-1;Q().value='';}else Q().value=CMDH[HPOS];setQ();}
  else if(e.key==='?'&&!Q().value){e.preventDefault();openRef();}
});
document.addEventListener('keydown',function(e){
  var inField=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();Q().focus();Q().select();return;}
  if(!inField&&e.key==='/'){e.preventDefault();Q().focus();return;}
  if(!inField&&e.key==='?'){e.preventDefault();openRef();}
  if(!inField&&e.key==='Escape'&&S.insp){S.insp=null;render();}
});

/* ── the Try row ── */
function tryState(k){
  HIST=[];CMDH=[];S=fresh();
  if(k==='first'){S.rooms=[{name:'Untitled room',plan:null,scheme:'default',device:'desktop',rails:'both',cfg:{},comps:[]}];S.guide={step:0};}
  if(k==='popped'){S.lib.kind='comp';popOut('library');}
  if(k==='compare'){S.hidden.collection=false;['comp:highlights','comp:notes','comp:comments'].forEach(function(x){addToColl(x);});S.coll.items.splice(2,0,{t:'s',name:'For the second pass'});
    S.coll.items[0].note='Keep: the essay leans on repeated phrases.';S.coll.name='Marking, for the essay';S.cmp=true;S.addr='collection';}
  if(k==='mobile'){var r=roomFromTpl('Pocket Chat','Pocket Chat');S.rooms.push(r);S.cur=1;}
  if(k==='block'){S.sel={t:'comp',cid:'input'};}
  if(k==='picked'){S.pick=['comp:toc','comp:comments','scheme:violet'];}
  if(k==='inspect'){S.insp='comp:input';}
  if(k==='popped'){S.insp='comp:highlights';}
  Q().value='';setQ();render();
  if(k==='fits'){write('place:contents');}
}

var pr=document.createElement('div');pr.id='poprow';pr.className='shint';pr.style.paddingTop='2px';pr.style.minHeight='0';
document.getElementById('p-bar').insertBefore(pr,document.getElementById('cref'));
window.addEventListener('resize',function(){render();});
render();
</script>
