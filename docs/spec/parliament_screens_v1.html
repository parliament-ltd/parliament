<!--

PARLIAMENT · SCREENS v1
Companion to parliament_lab_v6.html. What arrange: shows, and how
Parliament mentions a second screen. Reference material, not production code.
States are switched from the Try row.

THE RULES
  · No new verbs. The map is what bare arrange: shows, the way ? shows the
    reference. Everything done on it is an existing verb: pop: with a
    display (pop:library display 2), pop:back, move:, open:, close:,
    arrange:save "name", arrange:"name", reset:, and name:, duplicate: and
    delete: on a saved arrangement.
  · Nothing happens by itself. A second screen never rearranges anything.
  · "Extra screen detected" appears once, as marginalia under the field,
    when a second screen becomes available. Clicking it writes arrange:.
    Chromium reports that a second screen exists without asking; placing a
    window on it asks for permission once, the first time, and the Enter
    line says so before it happens.
  · With one screen, arrange: still shows the map, and a line at the bottom
    of the window says "No external screen detected", so the feature is
    found by the people who could use it.
  · In a browser that cannot place windows on other screens (Safari,
    Firefox), the bottom line says so instead, so nobody plugs in a monitor
    and wonders why nothing changed.
  · Each screen is labelled with marginalia: which display, how wide, and
    whether this window is on it.
  · The addressed board wears the navy rule on the map too.
  · Escape closes the map and returns to the arrangement.
-->
<style>

/* ═══ Carried from Almanac v30 ═══ */
:root{
  --paper-bg:#FCFCFA;
  --paper-ink:rgba(46,58,79,.011);
  --paper-hatch:none;   /* page hatch retired — it was noise, not texture */
  --card-lift:0 1px 2px rgba(40,36,28,.035);
  --p-surface:#FFFFFF;
  --p-subtle:#FAF9F5;          /* heading rows — off-white, warmer than grey */
  --p-tray:#F6F5F1;            /* the working-set tray, so white cards read  */
  --p-ink:#191919; --p-ink-2:#787774; --p-ink-3:#9B9A97; --p-line-soft:#C0C8D4;
  --p-border:#E9E9E7; --p-border-2:#F1F1EF;
  --p-gold-light:#B8A070; --p-gold-muted:#9C8760; --p-gold-deep:#8B6A10;
  --p-gold-tint:rgba(196,169,77,.08); --p-gold-tint-2:rgba(196,169,77,.14);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r-sm:4px; --r-md:6px; --r-xl:16px; --r-btn:8px;

  /* Command mode. Ruling only, no field behind it — the crosshatch carries
     the mode on its own and the type goes white over it. */
  --navy:38,56,92;
  --line-c:22,38,70;
  --line-a:1;
  --line-w:3px;
  --hatch-gap:3.5px;

  /* Prompt mode. Same idea as command — the fill carries the mode — but bone
     rather than navy, ruled into tall parallelograms with a diagonal through
     each, so the type stays ink and the field still reads as paper. */
  --tri:rgba(122,120,114,.17);
  --prm-bg:var(--paper-bg);

  /* Border and paper spec, light mode. Dark is unfinished and not referenced. */
  --ink:#191919;
  --ink-dot:rgba(25,25,25,.18);      /* structural: evenly spaced dots       */
  --ink-prog:rgba(25,25,25,.10);     /* key: progressive dash, one at a time  */
  --divider:rgba(25,25,25,.08);      /* header rules                          */
  --ink-soft:rgba(25,25,25,.30);     /* checkbox rule, quiet icons            */
  --ink-wash:rgba(25,25,25,.045);    /* selected rows and cards               */
  --ink-wash-2:rgba(25,25,25,.075);
  --marg:rgba(25,25,25,.46);         /* marginalia at rest                    */

  /* GOLD MEANS THE LIVE ACTION, AND NOTHING ELSE.
     The search field when engaged, the trigger on hover, keyboard focus.
     Every other former use is ink. */
}

*{box-sizing:border-box;margin:0;padding:0}

/* Borders are drawn as an SVG overlay, never as a CSS border. Patterns are
   computed from the element's real perimeter so they always close cleanly. */
[data-border]{position:relative}
svg.bx{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}

/* The key border is static. Nothing draws, nothing fades. */

/* The faint borders cannot carry focus. Keyboard focus gets its own ring. */
:focus-visible{outline:2px solid var(--p-gold-deep);outline-offset:2px}
/* Focus is a live action, so it keeps gold. Nothing else at rest does. */
body{
  font-family:var(--font-sans);background-color:var(--paper-bg);
  background-image:var(--paper-hatch);background-attachment:fixed;
  color:var(--p-ink);-webkit-font-smoothing:antialiased;padding:44px 16px 64px;
}

.card{background:var(--p-surface);border-radius:var(--r-xl);box-shadow:var(--card-lift);overflow:hidden}

.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;
  font:500 10px var(--font-mono);background:var(--p-subtle);border:.5px solid var(--p-border);border-radius:3px;color:var(--p-ink-3)}


.sbar{padding:0;position:relative}
.sfield{position:relative;display:flex;align-items:center}
.sfield>svg:not(.bx){position:absolute;right:12px;top:50%;margin-top:-7.5px;width:15px;height:15px;color:var(--ink);pointer-events:none}
.sfield{border-radius:var(--r-btn)}
.sfield input{width:100%;padding:10px 38px 10px 68px;font:400 13.5px var(--font-sans);
  border:none;border-radius:var(--r-btn);background:transparent;color:var(--p-ink)}
.sfield input:focus{outline:none}
/* ═══ The field is also the command line ═══
   Plain text searches. A leading > switches it into command mode: the box
   fills with a navy crosshatch and the type goes white. Deleting the > puts
   it straight back to prose. The first-character rule is what makes that
   safe — a > anywhere else is just a character. */
.sfield{
  background-color:var(--p-surface);   /* plain at rest; only command mode is ruled */
  overflow:hidden;
}
.sfield .fillwrap{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  clip-path:inset(0 100% 0 0);
  transition:clip-path .28s cubic-bezier(.4,0,.2,1);
}
.sfield.cmd .cmdwrap{clip-path:inset(0 0 0 0)}
.sfield.prm .prmwrap{clip-path:inset(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.sfield .fillwrap{transition:none}}
.sfield .fill{position:absolute;inset:0}
.sfield .fill>svg{width:100%;height:100%;display:block}
/* Command: a hexagonal lattice marked only at its edge points, two dots a side,
   one dot size throughout, about a quarter of them left dark. The hexagons
   themselves are never drawn. */
.sfield .cmdfill{background:rgb(var(--line-c))}
/* Prompt: the page's own bone, ruled into vertical parallelograms. */
.sfield .prmfill{background:var(--prm-bg)}
.sfield input{position:relative;z-index:1}
.sfield>svg:not(.bx),.sfield .modechip{z-index:2}
.sfield.cmd input{
  font-family:var(--font-mono);font-size:13px;color:#fff;
  text-shadow:0 0 3px rgba(12,20,40,.95),0 1px 2px rgba(12,20,40,.85);
}
.sfield.cmd input::placeholder{color:#fff;opacity:.95;text-shadow:0 0 3px rgba(12,20,40,.9)}
.sfield.cmd>svg:not(.bx){color:#fff;filter:drop-shadow(0 0 2px rgba(12,20,40,.9))}
.modechip{
  position:absolute;left:12px;top:50%;margin-top:-8px;font:600 8.5px var(--font-sans);letter-spacing:.06em;
  padding:3px 7px;border-radius:9px;background:rgb(var(--navy));color:#fff;
  opacity:0;transform:translateX(-4px);transition:opacity .16s ease,transform .16s ease;pointer-events:none;
}
.sfield .schip{opacity:1;transform:none}
.sfield.cmd .schip,.sfield.prm .schip{opacity:0;transform:translateX(-4px)}
.sfield.cmd .cmdchip{opacity:1;transform:none}
.sfield.cmd input{padding-left:82px}
.sfield.cmd>svg:not(.bx){opacity:0}
.sfield>svg:not(.bx){transition:opacity .16s ease}
/* Prompt names itself in ink, the way command names itself in navy. Search is
   the resting mode, so its pill is drawn rather than filled: bone inside, an
   ink rule around it, ink type. Gold is still only the live action. */
.sfield .pchip{background:var(--ink);color:var(--paper-bg)}
.sfield .schip{background:var(--paper-bg);color:var(--ink);border:1px solid var(--ink);padding:2px 6px}

/* ═══ The field is also the prompt ═══
   p> at the front switches it. Same pill as command, quill on the right where
   the magnifier sits, type left in ink. Deleting the leader puts it back. */
.sfield>svg.quillmark{right:10px;width:21px;height:21px;margin-top:-10.5px;color:var(--ink);opacity:0}
.sfield.prm>svg.quillmark{opacity:1}
.sfield.prm>svg.mag{opacity:0}
.sfield.prm .pchip{opacity:1;transform:none}
.sfield.prm input{padding-left:72px;padding-right:42px;color:var(--p-ink)}

/* Marginalia under the field. One line of reserved height that changes
   what it says rather than appearing, so nothing below it moves. At rest it
   says how to reach the command line; in command mode it lists the commands,
   narrowing as you type. Schemes are upright because they are literal text
   to type; the gloss beside each is italic, like all marginalia. */
.shint{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px;min-height:19px;padding:6px 13px 0;
  font:italic 400 11px var(--font-serif);color:var(--marg);line-height:1.6}
.shint:hover{color:var(--p-gold-deep)}
.shint .it{white-space:nowrap}
.shint .sep{opacity:.5;margin:0 3px 0 1px}
.shint code{font:normal 600 11px var(--font-serif);color:inherit;letter-spacing:.01em}
.shint button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
.shint button:hover{color:var(--ink)}
.shint button:hover .gl{text-decoration:underline;text-underline-offset:2px}
.shint .it.first code{color:var(--ink)}
.shint .none{white-space:nowrap}
.shint .pre{color:var(--ink);font-style:italic}
.shint .bad{color:var(--ink)}

/* The full reference. Asked for with ?, so it may cover the table; it floats
   rather than pushing anything down, and it goes the moment you type past it. */
.cref{display:none;position:absolute;left:0;right:0;top:66px;z-index:60;background:var(--p-surface);
  border-radius:var(--r-btn);padding:13px 16px 12px;box-shadow:0 8px 28px rgba(40,36,28,.08);
  max-height:64vh;overflow:auto}
.cref.open{display:block}
.topgrid.atbottom .cref{max-height:58vh}

/* Header: what this is, and a way to keep only one group */

.cref .rhead{padding-bottom:8px;margin-bottom:11px;border-bottom:.5px solid var(--p-border-2)}
.cref .rtop{display:flex;align-items:baseline;gap:10px}
.cref .rlab{font:600 9px var(--font-sans);letter-spacing:.055em;color:var(--ink)}
.cref .rlab .n{margin-left:5px;font-family:var(--font-mono);font-size:9px;color:var(--p-ink-3)}
.cref .chips{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.cref .chip{display:inline-block;width:auto;grid-template-columns:none;text-align:center;
  font:italic 400 11px var(--font-serif);color:var(--marg);border:none;background:none;
  padding:2px 8px;border-radius:9px;cursor:pointer}
.cref .chip:hover{color:var(--ink)}
.cref .chip.on{color:var(--ink);background:rgba(25,25,25,.055)}

/* Groups flow in columns; a group never splits across one */
.cref .cols{columns:318px;column-gap:28px}
.cref .grp{break-inside:avoid;margin:0 0 15px}
.cref h4{display:flex;align-items:baseline;font:600 9px var(--font-sans);letter-spacing:.055em;color:var(--ink);
  margin:0 0 5px;padding-bottom:4px;border-bottom:.5px solid var(--p-border-2)}
.cref h4 .n{margin-left:auto;font-family:var(--font-mono);font-size:9px;color:var(--p-ink-3);letter-spacing:0}
/* Two aligned columns so the eye runs down the syntax, not a ragged edge */
.cref button{display:grid;grid-template-columns:168px 1fr;gap:9px;align-items:baseline;width:100%;
  border:none;background:none;padding:4px 6px;border-radius:7px;cursor:pointer;text-align:left;color:var(--p-ink-2)}
.cref button:hover{color:var(--ink);background:rgba(25,25,25,.04)}
.cref button.sel{color:var(--ink);background:rgba(25,25,25,.06)}
.cref code{font:500 11px var(--font-mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cref .gl{font:italic 400 11px var(--font-serif);line-height:1.35}
.cref mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.cref .nohit{font:italic 400 11px var(--font-serif);color:var(--marg);padding:4px 6px}
.cref .foot{margin-top:4px;padding-top:9px;border-top:.5px solid var(--p-border-2);
  font:italic 400 10.5px var(--font-serif);color:var(--marg);line-height:1.5}

.kpill{display:inline-flex;align-items:center;gap:4px;font:500 10px var(--font-sans);padding:2px 7px;border-radius:9px;white-space:nowrap}

.menu{display:none;position:fixed;z-index:70;min-width:186px;max-height:300px;overflow-y:auto;padding:4px;
  background:var(--p-surface);border:.5px solid var(--p-border);border-radius:var(--r-md);box-shadow:0 6px 20px rgba(40,36,28,.14)}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;font:400 12px var(--font-sans);
  border:none;background:transparent;color:var(--p-ink);border-radius:var(--r-sm);cursor:pointer;text-align:left}
.menu button:hover{background:var(--p-subtle)}
.menu .tick{width:12px;height:12px;flex-shrink:0;color:var(--ink);opacity:0}
.menu button.on .tick{opacity:1}
.menu .n{margin-left:auto;font-size:10.5px;color:var(--p-ink-3)}


.wshead{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--divider)}
.wsname{font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wskind{font:500 8.5px var(--font-sans);letter-spacing:.05em;padding:2px 6px;border-radius:8px;flex-shrink:0}
.wskind.draft{background:var(--p-subtle);color:var(--p-ink-3)}
.wskind.saved{background:var(--ink-wash-2);color:var(--ink)}
.wscount{margin-left:auto;font-size:10.5px;color:var(--p-ink-3);flex-shrink:0}
.wsbody{max-height:640px;overflow-y:auto;padding:12px;background:var(--paper-bg)}
.wsempty{padding:36px 22px;text-align:center}
.wsempty svg{width:25px;height:25px;color:var(--p-line-soft);margin-bottom:10px}
.wsempty p{font-size:11.5px;line-height:1.55;color:var(--p-ink-3)}


/* ── Marginalia: italic serif, gold-muted, no fills, horizontal ── */
.marg{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 5px;margin-top:9px;
  font:italic 400 11px var(--font-serif);color:var(--marg);line-height:1.7;
  transition:color .16s ease}
.mc:hover .marg,.mk:hover .marg{color:var(--p-gold-deep)}
.marg > *{white-space:nowrap}
.marg .sep{opacity:.4}
.marg button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;
  white-space:nowrap;transition:color .12s ease}
.marg button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}


.btnrow{display:flex;gap:6px;align-items:stretch}
.btnrow button{
  flex:1 1 0;min-width:0;height:46px;padding:0 6px;
  font:500 10.5px var(--font-sans);letter-spacing:.005em;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--p-ink-2);border-radius:var(--r-btn);cursor:pointer;
}
.btnrow button:hover:not([disabled]){color:var(--ink)}
.btnrow button[disabled]{opacity:.3;cursor:default}


.sugg{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0}
.sugg button{padding:3px 8px;font:400 10px var(--font-sans);border:.5px dashed var(--p-line-soft);
  background:transparent;color:var(--p-ink-3);border-radius:10px;cursor:pointer}
.sugg button:hover{border-color:var(--ink-soft);color:var(--ink);border-style:solid}

body{font-family:var(--font-sans);background:var(--paper-bg);color:var(--p-ink);-webkit-font-smoothing:antialiased;padding:0 16px 110px}
.page{max-width:1180px;margin:0 auto}
.top{padding:14px 0 10px}
.sbar{max-width:720px;margin:0 auto}
.note{min-height:19px;padding:2px 13px 0;font:italic 400 11px var(--font-serif);color:var(--marg)}
.note button{font:inherit;color:var(--ink);border:none;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.stage{margin-top:22px}
/* the arrangement at rest: two boards */
.rest{display:grid;grid-template-columns:280px minmax(0,1fr);gap:13px}
.bd{position:relative;background:var(--p-surface);border-radius:var(--r-xl);box-shadow:var(--card-lift);min-height:380px}
.bd .h{padding:11px 14px 9px;border-bottom:1px solid var(--divider);font-size:12.5px;font-weight:600}
.bd .b{padding:14px;font:italic 400 11px var(--font-serif);color:var(--marg)}
.bd.addr::before{content:"";position:absolute;left:-7px;top:10px;bottom:10px;width:2px;background:rgb(var(--navy));border-radius:1px}
/* the map */
.map{display:flex;gap:34px;align-items:flex-end;justify-content:center;padding:34px 20px 10px}
.disp{display:flex;flex-direction:column;align-items:center;gap:8px}
.scr{position:relative;background:var(--p-subtle);border-radius:8px;padding:10px;display:flex;gap:7px}
.scr.empty{justify-content:center;align-items:center}
.scr .emp{font:italic 400 11px var(--font-serif);color:var(--marg)}
.mb{position:relative;background:var(--p-surface);border-radius:6px;box-shadow:var(--card-lift);padding:7px 9px;font:600 10.5px var(--font-sans);min-width:0}
.mb small{display:block;font:italic 400 10px var(--font-serif);color:var(--marg);font-weight:400;margin-top:2px}
.mb.addr::before{content:"";position:absolute;left:-5px;top:6px;bottom:6px;width:2px;background:rgb(var(--navy));border-radius:1px}
.mb.leaving{opacity:.35}
.mb.ghost{background:rgba(38,56,92,.07);box-shadow:inset 0 0 0 1.5px rgba(38,56,92,.7)}
.mb.win{box-shadow:var(--card-lift),0 0 0 .5px rgba(25,25,25,.12)}
.lab{font:italic 400 11px var(--font-serif);color:var(--marg);text-align:center;line-height:1.5}
.lab b{font:600 10.5px var(--font-sans);font-style:normal;color:var(--ink)}
.under{text-align:center;padding:16px 0 0}
.under .marg{justify-content:center}
.bottom{position:fixed;left:0;right:0;bottom:44px;text-align:center;font:italic 400 12px var(--font-serif);color:var(--p-ink-2)}
.bottom b{font-style:normal;font-weight:600;color:var(--ink);font-family:var(--font-sans);font-size:11.5px}
.trybar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:9px 18px;background:var(--paper-bg);border-top:.5px solid var(--p-border);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px}
.trybar b{font:italic 400 11px var(--font-serif);color:var(--marg);font-weight:400}
.trybar button{border:.5px solid var(--p-border);background:var(--p-surface);border-radius:12px;padding:3px 10px;font:400 11px var(--font-sans);color:var(--p-ink-2);cursor:pointer}
.trybar button.on{color:var(--ink);border-color:var(--ink)}
.bx{pointer-events:none}
</style>

    svg.setAttribute('class','bx'); svg.setAttribute('aria-hidden','true');
    el.appendChild(svg);
  }
  svg.innerHTML='';
  svg.setAttribute('width',w); svg.setAttribute('height',h);
  svg.setAttribute('viewBox','0 0 '+w+' '+h);

  var d=rrPath(w,h,r);
  function mkPath(cls){
    var q=document.createElementNS(NS,'path');
    q.setAttribute('d',d); q.setAttribute('fill','none');
    q.setAttribute('stroke-width','1'); q.setAttribute('stroke-linecap','round');
    if(cls) q.setAttribute('class',cls);
    svg.appendChild(q); return q;
  }

  if(kind==='prog'){
    /* Two paths. The ink one is the resting progressive dash: mirrored halves
       growing from a dot at the top-left to a solid bottom-right corner, so it
       reads like light falling from the top-left. The gold one is solid and
       hidden by its own length, and draws itself in when the element is live. */
    var ink=mkPath('prog-ink');
    var L=ink.getTotalLength();
    ink.style.stroke='var(--ink-prog)';
    var gEnd=3.5, gJoin=1, maxDash=12;
    var half=(L-gEnd-gJoin)/2, A=[], S=0;
    while(true){
      var t=Math.min(S/half,1);
      var dash=0.01+maxDash*Math.pow(t,1.4);
      var gap=3.5-2.6*t;
      if(A.length && S+gap+dash>half) break;
      if(A.length){A.push(gap);S+=gap;}
      A.push(dash); S+=dash;
    }
    A[A.length-1]+=half-S;
    ink.setAttribute('stroke-dasharray',A.concat([gJoin],A.slice().reverse(),[gEnd]).join(' '));

  }else{
    /* Even dots, spacing nudged so a whole number fits the perimeter exactly. */
    var dots=mkPath('');
    var L2=dots.getTotalLength();
    dots.style.stroke='var(--ink-dot)';
    var count=Math.max(4,Math.round(L2/4)), seg=L2/count;
    dots.setAttribute('stroke-dasharray','0.01 '+(seg-0.01));
  }
}

function paintAll(){document.querySelectorAll('[data-border]').forEach(paintBorder);}
var ST={
 detected:{q:'',hint:'<span class="pre">search the Library</span> <span class="sep">·</span> <code>&gt;</code> changes the room <span class="sep">·</span> <code>p&gt;</code> tries it',
   note:'Extra screen detected <span class="sep">·</span> <button>arrange across screens</button>',view:'rest',bottom:''},
 map2:{q:'>arrange:',hint:'<span class="pre">\u2192 the Lab</span> <span class="sep">·</span> Enter keeps this view open; <code>pop:library display 2</code> puts a board on the other screen',note:'',view:'map2',bottom:''},
 moving:{q:'>pop:library display 2',hint:'<span class="pre">\u2192 the Lab</span> <span class="sep">·</span> Enter puts the Library in its own window on display 2; the browser asks once for permission to place windows',note:'',view:'moving',bottom:''},
 placed:{q:'>arrange:',hint:'<span class="pre">\u2192 the Lab</span> <span class="sep">·</span> <code>arrange:save "Two screens"</code> keeps this; <code>pop:back library</code> brings it home',note:'',view:'placed',bottom:''},
 one:{q:'>arrange:',hint:'<span class="pre">\u2192 the Lab</span> <span class="sep">·</span> Enter keeps this view open; Escape goes back',note:'',view:'one',
   bottom:'<b>No external screen detected.</b> Connect one and boards can go on it.'},
 nosupport:{q:'>arrange:',hint:'<span class="pre">\u2192 the Lab</span> <span class="sep">·</span> Enter keeps this view open; Escape goes back',note:'',view:'one',
   bottom:'<b>This browser cannot place boards on other screens.</b> Chrome and Edge can; everything else works here.'}
};
function mb(name,sub,w,h,cls){return '<div class="mb '+(cls||'')+'" style="width:'+w+'px;height:'+h+'px">'+name+(sub?'<small>'+sub+'</small>':'')+'</div>';}
function disp(n,wide,this_,inner,W,H,empty){
  return '<div class="disp"><div class="scr'+(empty?' empty':'')+'" style="width:'+W+'px;height:'+H+'px" data-border="dot" data-radius="8">'+inner+'</div>'+
    '<div class="lab"><b>Display '+n+'</b><br>'+wide+' wide'+(this_?', this window':'')+'</div></div>';
}
function view(v){
  if(v==='rest') return '<div class="rest"><div class="bd"><div class="h">Library</div><div class="b">the catalogue</div></div><div class="bd addr"><div class="h">Canvas</div><div class="b">Writing Studio</div></div></div>';
  var d1, d2, one=v==='one';
  if(v==='map2'||v==='one') d1=mb('Library','',90,168)+mb('Canvas','Writing Studio',206,168,'addr');
  if(v==='moving') d1=mb('Library','moving to display 2',90,168,'leaving')+mb('Canvas','Writing Studio',206,168,'addr');
  if(v==='placed') d1=mb('Canvas','Writing Studio',303,168,'addr');
  d2=v==='moving'?mb('Library','will land here',200,120,'ghost'):v==='placed'?mb('Library','its own window',200,120,'win'):'<span class="emp">nothing here yet</span>';
  var map='<div class="map">'+disp(1,'1512',true,d1,320,190)+(one?'':disp(2,'2560',false,d2,380,214,v==='map2'))+'</div>';
  var under='<div class="under"><div class="marg"><span><b style="font-style:normal">The Lab</b>, '+(v==='placed'?'across two screens':'Library and Canvas')+'</span><span class="sep">·</span><span>arrange:save "\u2026" keeps it</span><span class="sep">·</span><span>reset: returns it to its default</span><span class="sep">·</span><span>Escape goes back</span></div></div>';
  return map+under;
}
function show(k){
  var s=ST[k], q=document.getElementById('q'), f=document.getElementById('sfield');
  q.value=s.q; f.classList.toggle('cmd',/^>/.test(s.q));
  document.getElementById('shint').innerHTML=s.hint;
  document.getElementById('note').innerHTML=s.note;
  document.getElementById('stage').innerHTML=view(s.view);
  document.getElementById('bottom').innerHTML=s.bottom;
  document.querySelectorAll('[data-s]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===k);});
  paintAll();
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-s]'); if(t) show(t.getAttribute('data-s'));
  if(e.target.closest('#note button')) show('map2');});
show('detected');
</script>
