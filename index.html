<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Parliament</title>

    <!-- Browser tab icon: the three birds (29 October), dark on a light tab bar,
         light on a dark one. The older picture stays for browsers without
         SVG icons. -->
    <link rel="icon" type="image/png" href="/parliament_logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme colour — matches bg-primary (#FFFFFF) from the design system -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- iOS / Safari homescreen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Parliament" />
    <link rel="apple-touch-icon" href="/parliament_logo.png" />

    <!-- No connection to a provider is opened on load: nothing reaches one
         before Enter (privacy-copy-draft.md; plan-brief rule 4; C185). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
